name: _ Build Application Image

on:
  workflow_call:
    inputs:
      source_revision:
        description: Exact Git commit SHA to build
        required: true
        type: string
      image_name:
        description: Harbor image name
        required: true
        type: string
      dockerfile:
        description: Dockerfile path relative to the repository root
        required: true
        type: string
    outputs:
      image_tag:
        value: ${{ jobs.build.outputs.image_tag }}
      digest:
        value: ${{ jobs.build.outputs.digest }}

env:
  HARBOR_REGISTRY: harbor.pegasusum.com
  HARBOR_PROJECT: nexum_backend

jobs:
  build:
    name: Build and Push ${{ inputs.image_name }}
    runs-on: actiontest

    outputs:
      image_tag: ${{ steps.metadata.outputs.image_tag }}
      digest: ${{ steps.image.outputs.digest }}

    steps:
      - name: Checkout source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 1

      - name: Prepare image tag
        id: metadata
        shell: bash
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: echo "image_tag=git-${SOURCE_REVISION:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host
          buildkitd-config-inline: |
            [registry."${{ env.HARBOR_REGISTRY }}"]
              insecure = true

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          outputs: type=image,name=${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ inputs.image_name }},push-by-digest=true,name-canonical=true,push=true

      # The commit alias is immutable even if the same source is built again.
      - name: Create immutable commit alias
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          repository="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}"
          existing="$(
            docker buildx imagetools inspect "${repository}:${IMAGE_TAG}" 2>/dev/null |
              awk '/^Digest:/ {print $2; exit}' || true
          )"

          if [[ -n "$existing" ]]; then
            [[ "$existing" == "$DIGEST" ]] || {
              echo "Immutable candidate tag conflict: ${repository}:${IMAGE_TAG}"
              exit 1
            }
          else
            docker buildx imagetools create \
              --tag "${repository}:${IMAGE_TAG}" \
              "${repository}@${DIGEST}"
          fi

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Nexum image"
            echo "- Image: \`${{ inputs.image_name }}\`"
            echo "- Source revision: \`${{ inputs.source_revision }}\`"
            echo "- Image tag: \`${{ steps.metadata.outputs.image_tag }}\`"
            echo "- Digest: \`${{ steps.image.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"