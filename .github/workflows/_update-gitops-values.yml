name: _ Update GitOps Values

on:
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string
      artifact_set:
        description: JSON array containing webapp, internalapi and externalapi digests
        required: true
        type: string
      release_id:
        description: Immutable build, release candidate or final release identifier
        required: true
        type: string
      release_status:
        description: Catalog status (build, candidate or final)
        required: true
        type: string
      create_catalog:
        description: Create the catalog record when it does not exist
        required: false
        default: false
        type: boolean
      catalog_id:
        description: Catalog filename without .yaml; defaults to release_id
        required: false
        default: ""
        type: string
      update_catalog:
        description: Advance an existing version catalog to a newer RC or final state
        required: false
        default: false
        type: boolean
      create_pr:
        description: Open a GitOps pull request instead of pushing directly to the target branch
        required: false
        default: true
        type: boolean
      image_tag:
        required: true
        type: string
      version:
        required: true
        type: string
      source_branch:
        required: true
        type: string
      source_revision:
        required: true
        type: string
      promoted_from:
        required: true
        type: string
      commit_message:
        required: true
        type: string
    secrets:
      GITOPS_TOKEN:
        required: true
    outputs:
      pull_request_number:
        value: ${{ jobs.update.outputs.pull_request_number }}
      pull_request_url:
        value: ${{ jobs.update.outputs.pull_request_url }}

env:
  HARBOR_REGISTRY: registry.kube-system.svc.cluster.local:80
  HARBOR_PROJECT: nexum
  GITOPS_OWNER: stdsoksak
  GITOPS_REPOSITORY: test-gitops
  GITOPS_BRANCH: main
  GITOPS_PROJECT_PATH: nexum/argocd/environments
  GITOPS_RELEASE_PATH: nexum/releases

jobs:
  update:
    name: Update ${{ inputs.target_environment }} artifact set
    runs-on: nexum-project-local
    environment: ${{ inputs.target_environment }}

    outputs:
      pull_request_number: ${{ steps.create-pr.outputs.pull-request-number }}
      pull_request_url: ${{ steps.create-pr.outputs.pull-request-url }}

    steps:
      - name: Checkout source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Read source commit metadata
        id: source-commit
        shell: bash
        run: |
          set -euo pipefail

          short_revision="$(git -C source rev-parse --short=12 HEAD)"
          subject="$(git -C source log -1 --format=%s)"

          {
            echo "short_revision=$short_revision"
            echo "subject<<EOF"
            echo "$subject"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_OWNER }}/${{ env.GITOPS_REPOSITORY }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          fetch-depth: 0
          persist-credentials: true

      - name: Validate artifact set and update values
        id: update-values
        uses: mikefarah/yq@v4.53.6
        env:
          ARTIFACT_SET: ${{ inputs.artifact_set }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          CREATE_CATALOG: ${{ inputs.create_catalog }}
          CATALOG_ID: ${{ inputs.catalog_id }}
          UPDATE_CATALOG: ${{ inputs.update_catalog }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          VERSION: ${{ inputs.version }}
          TARGET_ENV: ${{ inputs.target_environment }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          PROMOTED_FROM: ${{ inputs.promoted_from }}
        with:
          cmd: |
            set -eu

            case "$TARGET_ENV" in
              webnd|webnt|webct|prod) ;;
              *) echo "Unsupported target environment: $TARGET_ENV"; exit 1 ;;
            esac

            case "$RELEASE_STATUS" in
              build|candidate|final) ;;
              *) echo "Unsupported release status: $RELEASE_STATUS"; exit 1 ;;
            esac

            case "$RELEASE_STATUS" in
              build) release_pattern='^git-[0-9a-f]{7,40}$' ;;
              candidate) release_pattern='^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$' ;;
              final) release_pattern='^v[0-9]+\.[0-9]+\.[0-9]+$' ;;
            esac
            printf '%s\n' "$RELEASE_ID" | grep -Eq "$release_pattern" || {
              echo "$RELEASE_STATUS release ID has an invalid format: $RELEASE_ID"
              exit 1
            }

            printf '%s\n' "$SOURCE_REVISION" | grep -Eq '^[0-9a-f]{40,64}$' || {
              echo "Invalid full source revision: $SOURCE_REVISION"
              exit 1
            }

            printf '%s\n' "$ARTIFACT_SET" |
              yq -e '(tag == "!!seq") and (length == 3)' >/dev/null

            label_branch="$(printf '%s' "$SOURCE_BRANCH" | tr '/' '-')"

            for required_app in webapp internalapi externalapi; do
              match_count="$(
                printf '%s\n' "$ARTIFACT_SET" |
                  APP_NAME="$required_app" yq -r '[.[] | select(.app_name == strenv(APP_NAME))] | length'
              )"
              [ "$match_count" -eq 1 ]
            done

            file_pattern=""
            for app_name in $(printf '%s\n' "$ARTIFACT_SET" | yq -r '.[].app_name'); do
              digest="$(
                printf '%s\n' "$ARTIFACT_SET" |
                  APP_NAME="$app_name" yq -r '.[] | select(.app_name == strenv(APP_NAME)) | .digest'
              )"

              printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
                echo "Invalid digest for $app_name: $digest"
                exit 1
              }

              values_path="$GITOPS_PROJECT_PATH/$TARGET_ENV/$app_name/values.yaml"
              [ -f "gitops/$values_path" ] || {
                echo "Missing GitOps values file: $values_path"
                exit 1
              }

              file_pattern="${file_pattern}${file_pattern:+,}${values_path}"

              APP_NAME="$app_name" DIGEST="$digest" LABEL_BRANCH="$label_branch" yq -i \
                '.deployment.image.tag = strenv(IMAGE_TAG) |
                 .deployment.image.digest = strenv(DIGEST) |
                 .deployment.labels."app.kubernetes.io/name" = strenv(APP_NAME) |
                 .deployment.labels."app.kubernetes.io/version" = strenv(VERSION) |
                 .deployment.labels."nexum.pegasusum.com/release-id" = strenv(RELEASE_ID) |
                 .deployment.labels."nexum.pegasusum.com/environment" = strenv(TARGET_ENV) |
                 .deployment.labels."nexum.pegasusum.com/source-branch" = strenv(LABEL_BRANCH) |
                 .deployment.labels."nexum.pegasusum.com/source-revision" = strenv(SOURCE_REVISION) |
                 .deployment.labels."nexum.pegasusum.com/promoted-from" = strenv(PROMOTED_FROM)' \
                "gitops/$values_path"
            done

            if [ "$CREATE_CATALOG" = "true" ]; then
              catalog_id="$CATALOG_ID"
              [ -n "$catalog_id" ] || catalog_id="$RELEASE_ID"
              catalog_path="$GITOPS_RELEASE_PATH/$catalog_id.yaml"
              mkdir -p "gitops/$GITOPS_RELEASE_PATH"
              write_catalog=true

              if [ -f "gitops/$catalog_path" ]; then
                [ "$(yq -r '.apiVersion' "gitops/$catalog_path")" = "nexum.pegasusum.com/v1" ]
                [ "$(yq -r '.kind' "gitops/$catalog_path")" = "Release" ]
                created_at="$(yq -r '.release.createdAt // ""' "gitops/$catalog_path")"
                [ -n "$created_at" ]
                existing_id="$(yq -r '.release.id // ""' "gitops/$catalog_path")"
                existing_status="$(yq -r '.release.status // ""' "gitops/$catalog_path")"

                if [ "$existing_id" = "$RELEASE_ID" ]; then
                  [ "$existing_status" = "$RELEASE_STATUS" ]
                  [ "$(yq -r '.source.branch' "gitops/$catalog_path")" = "$SOURCE_BRANCH" ]
                  [ "$(yq -r '.source.revision' "gitops/$catalog_path")" = "$SOURCE_REVISION" ]

                  for app_name in webapp internalapi externalapi; do
                    expected_digest="$(
                      printf '%s\n' "$ARTIFACT_SET" |
                        APP_NAME="$app_name" yq -r '.[] | select(.app_name == strenv(APP_NAME)) | .digest'
                    )"
                    [ "$(APP_NAME="$app_name" yq -r '.services[strenv(APP_NAME)].digest' "gitops/$catalog_path")" = "$expected_digest" ]
                    [ "$(APP_NAME="$app_name" yq -r '.services[strenv(APP_NAME)].sourceCommit' "gitops/$catalog_path")" = "$SOURCE_REVISION" ]
                    [ "$(APP_NAME="$app_name" yq -r '.services[strenv(APP_NAME)].tag' "gitops/$catalog_path")" = "$IMAGE_TAG" ]
                    [ "$(APP_NAME="$app_name" yq -r '.services[strenv(APP_NAME)].repository' "gitops/$catalog_path")" = "$HARBOR_REGISTRY/$HARBOR_PROJECT/$app_name" ]
                  done
                  write_catalog=false
                elif [ "$UPDATE_CATALOG" = "true" ] && [ "$RELEASE_STATUS" = "candidate" ]; then
                  [ "$existing_status" = "candidate" ]
                  escaped_catalog_id="$(printf '%s' "$catalog_id" | sed 's/\./\\./g')"
                  printf '%s\n' "$existing_id" | grep -Eq "^${escaped_catalog_id}-rc\.[1-9][0-9]*$"
                  printf '%s\n' "$RELEASE_ID" | grep -Eq "^${escaped_catalog_id}-rc\.[1-9][0-9]*$"
                  existing_rc="${existing_id##*.}"
                  next_rc="${RELEASE_ID##*.}"
                  [ "$next_rc" -gt "$existing_rc" ]
                  [ "$(yq -r '.source.branch' "gitops/$catalog_path")" = "$SOURCE_BRANCH" ]
                elif [ "$UPDATE_CATALOG" = "true" ] && [ "$RELEASE_STATUS" = "final" ]; then
                  [ "$existing_status" = "candidate" ]
                  [ "$RELEASE_ID" = "$catalog_id" ]
                  escaped_catalog_id="$(printf '%s' "$catalog_id" | sed 's/\./\\./g')"
                  printf '%s\n' "$existing_id" | grep -Eq "^${escaped_catalog_id}-rc\.[1-9][0-9]*$"
                  [ "$(yq -r '.source.revision' "gitops/$catalog_path")" = "$SOURCE_REVISION" ]

                  for app_name in webapp internalapi externalapi; do
                    expected_digest="$(
                      printf '%s\n' "$ARTIFACT_SET" |
                        APP_NAME="$app_name" yq -r '.[] | select(.app_name == strenv(APP_NAME)) | .digest'
                    )"
                    [ "$(APP_NAME="$app_name" yq -r '.services[strenv(APP_NAME)].digest' "gitops/$catalog_path")" = "$expected_digest" ]
                  done
                else
                  echo "Catalog $catalog_id cannot move from $existing_id ($existing_status) to $RELEASE_ID ($RELEASE_STATUS)."
                  exit 1
                fi
              else
                created_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              fi

              if [ "$write_catalog" = "true" ]; then
                updated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                webapp_digest="$(printf '%s\n' "$ARTIFACT_SET" | yq -r '.[] | select(.app_name == "webapp") | .digest')"
                internalapi_digest="$(printf '%s\n' "$ARTIFACT_SET" | yq -r '.[] | select(.app_name == "internalapi") | .digest')"
                externalapi_digest="$(printf '%s\n' "$ARTIFACT_SET" | yq -r '.[] | select(.app_name == "externalapi") | .digest')"

                CATALOG_ID="$catalog_id" CREATED_AT="$created_at" UPDATED_AT="$updated_at" RUN_URL="$run_url" \
                WEBAPP_DIGEST="$webapp_digest" INTERNALAPI_DIGEST="$internalapi_digest" \
                EXTERNALAPI_DIGEST="$externalapi_digest" yq -n '
                  {
                    "apiVersion": "nexum.pegasusum.com/v1",
                    "kind": "Release",
                    "release": {
                      "id": strenv(RELEASE_ID),
                      "catalogId": strenv(CATALOG_ID),
                      "status": strenv(RELEASE_STATUS),
                      "createdAt": strenv(CREATED_AT),
                      "updatedAt": strenv(UPDATED_AT)
                    },
                    "source": {
                      "branch": strenv(SOURCE_BRANCH),
                      "revision": strenv(SOURCE_REVISION)
                    },
                    "workflow": {
                      "repository": strenv(GITHUB_REPOSITORY),
                      "runId": strenv(GITHUB_RUN_ID),
                      "runAttempt": strenv(GITHUB_RUN_ATTEMPT),
                      "runUrl": strenv(RUN_URL)
                    },
                    "services": {
                      "webapp": {
                        "sourceCommit": strenv(SOURCE_REVISION),
                        "repository": strenv(HARBOR_REGISTRY) + "/" + strenv(HARBOR_PROJECT) + "/webapp",
                        "digest": strenv(WEBAPP_DIGEST),
                        "tag": strenv(IMAGE_TAG)
                      },
                      "internalapi": {
                        "sourceCommit": strenv(SOURCE_REVISION),
                        "repository": strenv(HARBOR_REGISTRY) + "/" + strenv(HARBOR_PROJECT) + "/internalapi",
                        "digest": strenv(INTERNALAPI_DIGEST),
                        "tag": strenv(IMAGE_TAG)
                      },
                      "externalapi": {
                        "sourceCommit": strenv(SOURCE_REVISION),
                        "repository": strenv(HARBOR_REGISTRY) + "/" + strenv(HARBOR_PROJECT) + "/externalapi",
                        "digest": strenv(EXTERNALAPI_DIGEST),
                        "tag": strenv(IMAGE_TAG)
                      }
                    }
                  }
                ' > "gitops/$catalog_path"
              fi

              file_pattern="${file_pattern},${catalog_path}"
            fi

            printf 'file_pattern=%s\n' "$file_pattern" >> "$GITHUB_OUTPUT"

      # Reviewed environments reach Argo CD only after this pull request is merged.
      - name: Create GitOps pull request
        if: inputs.create_pr
        id: create-pr
        uses: peter-evans/create-pull-request@v7.0.11
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          base: ${{ env.GITOPS_BRANCH }}
          branch: gitops/nexum-${{ inputs.target_environment }}-${{ inputs.release_id }}
          delete-branch: true
          commit-message: ${{ inputs.commit_message }}
          title: ${{ inputs.commit_message }}
          body: |
            Promotes Nexum `${{ inputs.release_id }}` from `${{ inputs.promoted_from }}` to `${{ inputs.target_environment }}`.

            Source commit: [`${{ steps.source-commit.outputs.short_revision }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ inputs.source_revision }}) - ${{ steps.source-commit.outputs.subject }}
            Source branch: `${{ inputs.source_branch }}`
            Full source revision: `${{ inputs.source_revision }}`
            Release status: `${{ inputs.release_status }}`

            Artifact set:
            ```json
            ${{ inputs.artifact_set }}
            ```
          add-paths: ${{ steps.update-values.outputs.file_pattern }}
          committer: nexum-gitops[bot] <nexum-gitops@pegasus.local>
          author: nexum-gitops[bot] <nexum-gitops@pegasus.local>

      - name: Push GitOps values directly
        if: ${{ !inputs.create_pr }}
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          FILE_PATTERN: ${{ steps.update-values.outputs.file_pattern }}
        run: |
          set -euo pipefail

          git -C gitops config user.name "nexum-gitops[bot]"
          git -C gitops config user.email "nexum-gitops@pegasus.local"
          IFS=',' read -r -a changed_paths <<< "$FILE_PATTERN"
          git -C gitops add -- "${changed_paths[@]}"

          git -C gitops diff --cached --quiet && exit 0
          git -C gitops commit -m "$COMMIT_MESSAGE"
          git -C gitops push origin "HEAD:${GITOPS_BRANCH}"