name: _ Update GitOps Values

on:
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string
      artifact_set:
        description: JSON array containing webapp, internalapi and externalapi digests
        required: true
        type: string
      release_id:
        description: Immutable build, release candidate or final release identifier
        required: true
        type: string
      release_status:
        description: Catalog status (build, candidate or final)
        required: true
        type: string
      create_catalog:
        description: Create the catalog record when it does not exist
        required: false
        default: false
        type: boolean
      catalog_id:
        description: Catalog filename without .yaml; defaults to release_id
        required: false
        default: ""
        type: string
      update_catalog:
        description: Advance an existing version catalog to a newer RC or final state
        required: false
        default: false
        type: boolean
      create_pr:
        description: Open a GitOps pull request instead of pushing directly to the target branch
        required: false
        default: true
        type: boolean
      image_tag:
        required: true
        type: string
      version:
        required: true
        type: string
      source_branch:
        required: true
        type: string
      source_revision:
        required: true
        type: string
      promoted_from:
        required: true
        type: string
      commit_message:
        required: true
        type: string
    secrets:
      GITOPS_TOKEN:
        required: true

env:
  HARBOR_REGISTRY: registry.kube-system.svc.cluster.local:80
  HARBOR_PROJECT: nexum
  GITOPS_OWNER: stdsoksak
  GITOPS_REPOSITORY: test-gitops
  GITOPS_BRANCH: main
  GITOPS_PROJECT_PATH: nexum/argocd/environments
  GITOPS_RELEASE_PATH: nexum/releases

jobs:
  update:
    name: Update ${{ inputs.target_environment }} artifact set
    runs-on: nexum-project-local
    environment: ${{ inputs.target_environment }}

    steps:
      - name: Checkout source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Read source commit metadata
        id: source-commit
        shell: bash
        run: |
          set -euo pipefail

          short_revision="$(git -C source rev-parse --short=12 HEAD)"
          subject="$(git -C source log -1 --format=%s)"

          {
            echo "short_revision=$short_revision"
            echo "subject<<EOF"
            echo "$subject"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_OWNER }}/${{ env.GITOPS_REPOSITORY }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve GitOps pull request branch
        if: inputs.create_pr
        id: gitops-pr-branch
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.target_environment }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          RELEASE_ID: ${{ inputs.release_id }}
          CATALOG_ID: ${{ inputs.catalog_id }}
        run: |
          set -euo pipefail

          hydrate_candidate=false
          if [[ "$TARGET_ENV" == "webct" && "$RELEASE_STATUS" == "candidate" ]]; then
            [[ "$CATALOG_ID" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "WEBCT candidate requires a semantic version catalog ID."
              exit 1
            }
            pull_request_branch="gitops/nexum-webct-${CATALOG_ID}"
            hydrate_candidate=true
          else
            pull_request_branch="gitops/nexum-${TARGET_ENV}-${RELEASE_ID}"
          fi
          echo "branch=$pull_request_branch" >> "$GITHUB_OUTPUT"

          if [[ "$hydrate_candidate" != "true" ]] ||
             ! git -C gitops ls-remote --exit-code --heads origin "refs/heads/$pull_request_branch" >/dev/null 2>&1; then
            exit 0
          fi

          git -C gitops fetch origin "refs/heads/$pull_request_branch:refs/remotes/origin/$pull_request_branch"
          if git -C gitops merge-base --is-ancestor "origin/$pull_request_branch" HEAD; then
            exit 0
          fi

          pending_paths=(
            "$GITOPS_RELEASE_PATH/$CATALOG_ID.yaml"
            "$GITOPS_PROJECT_PATH/webct/webapp/values.yaml"
            "$GITOPS_PROJECT_PATH/webct/internalapi/values.yaml"
            "$GITOPS_PROJECT_PATH/webct/externalapi/values.yaml"
          )
          for pending_path in "${pending_paths[@]}"; do
            if git -C gitops cat-file -e "origin/$pull_request_branch:$pending_path" 2>/dev/null; then
              git -C gitops checkout "origin/$pull_request_branch" -- "$pending_path"
            fi
          done

      - name: Prepare catalog file ownership
        if: inputs.create_catalog
        id: prepare-catalog
        shell: bash
        env:
          CATALOG_ID: ${{ inputs.catalog_id }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail

          catalog_id="$CATALOG_ID"
          [[ -n "$catalog_id" ]] || catalog_id="$RELEASE_ID"
          [[ "$catalog_id" =~ ^(git-[0-9a-f]{7,40}|v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?)$ ]]

          catalog_path="gitops/${GITOPS_RELEASE_PATH}/${catalog_id}.yaml"
          mkdir -p "$(dirname "$catalog_path")"
          if [[ -e "$catalog_path" ]]; then
            [[ -s "$catalog_path" ]] || {
              echo "Existing catalog is empty: $catalog_path"
              exit 1
            }
            echo "preexisting=true" >> "$GITHUB_OUTPUT"
          else
            touch "$catalog_path"
            echo "preexisting=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate artifact set and update values
        id: update-values
        uses: mikefarah/yq@v4.53.6
        env:
          ARTIFACT_SET: ${{ inputs.artifact_set }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          CREATE_CATALOG: ${{ inputs.create_catalog }}
          CATALOG_ID: ${{ inputs.catalog_id }}
          UPDATE_CATALOG: ${{ inputs.update_catalog }}
          CATALOG_PREEXISTING: ${{ steps.prepare-catalog.outputs.preexisting }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          VERSION: ${{ inputs.version }}
          TARGET_ENV: ${{ inputs.target_environment }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          PROMOTED_FROM: ${{ inputs.promoted_from }}
        with:
          cmd: |
            set -eu

            case "$TARGET_ENV" in
              webnd|webnt|webct|prod) ;;
              *) echo "Unsupported target environment: $TARGET_ENV"; exit 1 ;;
            esac

            case "$RELEASE_STATUS" in
              build|candidate|final) ;;
              *) echo "Unsupported release status: $RELEASE_STATUS"; exit 1 ;;
            esac

            case "$RELEASE_STATUS" in
              build) release_pattern='^git-[0-9a-f]{7,40}$' ;;
              candidate) release_pattern='^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$' ;;
              final) release_pattern='^v[0-9]+\.[0-9]+\.[0-9]+$' ;;
            esac
            printf '%s\n' "$RELEASE_ID" | grep -Eq "$release_pattern" || {
              echo "$RELEASE_STATUS release ID has an invalid format: $RELEASE_ID"
              exit 1
            }

            printf '%s\n' "$SOURCE_REVISION" | grep -Eq '^[0-9a-f]{40,64}$' || {
              echo "Invalid full source revision: $SOURCE_REVISION"
              exit 1
            }

            printf '%s\n' "$ARTIFACT_SET" |
              yq -e '(tag == "!!seq") and (length == 3)' >/dev/null

            label_branch="$(printf '%s' "$SOURCE_BRANCH" | tr '/' '-')"

            for required_app in webapp internalapi externalapi; do
              match_count="$(
                printf '%s\n' "$ARTIFACT_SET" |
                  APP_NAME="$required_app" yq -r '[.[] | select(.app_name == strenv(APP_NAME))] | length'
              )"
              [ "$match_count" -eq 1 ]
            done

            file_pattern=""
            for app_name in $(printf '%s\n' "$ARTIFACT_SET" | yq -r '.[].app_name'); do
              digest="$(
                printf '%s\n' "$ARTIFACT_SET" |
                  APP_NAME="$app_name" yq -r '.[] | select(.app_name == strenv(APP_NAME)) | .digest'
              )"

              printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
                echo "Invalid digest for $app_name: $digest"
                exit 1
              }

              values_path="$GITOPS_PROJECT_PATH/$TARGET_ENV/$app_name/values.yaml"
              [ -f "gitops/$values_path" ] || {
                echo "Missing GitOps values file: $values_path"
                exit 1
              }

              file_pattern="${file_pattern}${file_pattern:+,}${values_path}"

              APP_NAME="$app_name" DIGEST="$digest" LABEL_BRANCH="$label_branch" yq -i \
                '.deployment.image.tag = strenv(IMAGE_TAG) |
                 .deployment.image.digest = strenv(DIGEST) |
                 .deployment.labels."app.kubernetes.io/name" = strenv(APP_NAME) |
                 .deployment.labels."app.kubernetes.io/version" = strenv(VERSION) |
                 .deployment.labels."nexum.pegasusum.com/release-id" = strenv(RELEASE_ID) |
                 .deployment.labels."nexum.pegasusum.com/environment" = strenv(TARGET_ENV) |
                 .deployment.labels."nexum.pegasusum.com/source-branch" = strenv(LABEL_BRANCH) |
                 .deployment.labels."nexum.pegasusum.com/source-revision" = strenv(SOURCE_REVISION) |
                 .deployment.labels."nexum.pegasusum.com/promoted-from" = strenv(PROMOTED_FROM)' \
                "gitops/$values_path"
            done

            if [ "$CREATE_CATALOG" = "true" ]; then
              catalog_id="$CATALOG_ID"
              [ -n "$catalog_id" ] || catalog_id="$RELEASE_ID"
              catalog_path="$GITOPS_RELEASE_PATH/$catalog_id.yaml"
              catalog="gitops/$catalog_path"
              now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              webapp_digest="$(printf '%s\n' "$ARTIFACT_SET" | yq -r '.[] | select(.app_name == "webapp") | .digest')"
              internalapi_digest="$(printf '%s\n' "$ARTIFACT_SET" | yq -r '.[] | select(.app_name == "internalapi") | .digest')"
              externalapi_digest="$(printf '%s\n' "$ARTIFACT_SET" | yq -r '.[] | select(.app_name == "externalapi") | .digest')"

              if [ "$CATALOG_PREEXISTING" != "true" ]; then
                CATALOG_ID="$catalog_id" CREATED_AT="$now" yq -n '
                  {
                    "version": strenv(CATALOG_ID),
                    "status": "candidate",
                    "activeCandidate": null,
                    "createdAt": strenv(CREATED_AT),
                    "updatedAt": strenv(CREATED_AT),
                    "candidates": [],
                    "final": null
                  }
                ' > "$catalog"
              fi

              [ "$(yq -r '.version // ""' "$catalog")" = "$catalog_id" ]
              [ "$(yq -r '.apiVersion // ""' "$catalog")" = "" ]
              [ "$(yq -r '.kind // ""' "$catalog")" = "" ]
              [ -n "$(yq -r '.createdAt // ""' "$catalog")" ]
              yq -e '(.candidates | tag == "!!seq") and (.final == null or (.final | tag == "!!map"))' "$catalog" >/dev/null

              validate_record() {
                catalog_record="$1"
                [ "$(printf '%s\n' "$catalog_record" | yq -r '.id // ""')" = "$RELEASE_ID" ]
                [ "$(printf '%s\n' "$catalog_record" | yq -r '.source.branch // ""')" = "$SOURCE_BRANCH" ]
                [ "$(printf '%s\n' "$catalog_record" | yq -r '.source.revision // ""')" = "$SOURCE_REVISION" ]

                for app_name in webapp internalapi externalapi; do
                  expected_digest="$(
                    printf '%s\n' "$ARTIFACT_SET" |
                      APP_NAME="$app_name" yq -r '.[] | select(.app_name == strenv(APP_NAME)) | .digest'
                  )"
                  [ "$(printf '%s\n' "$catalog_record" | APP_NAME="$app_name" yq -r '.services[strenv(APP_NAME)].digest // ""')" = "$expected_digest" ]
                  [ "$(printf '%s\n' "$catalog_record" | APP_NAME="$app_name" yq -r '.services[strenv(APP_NAME)].sourceCommit // ""')" = "$SOURCE_REVISION" ]
                  [ "$(printf '%s\n' "$catalog_record" | APP_NAME="$app_name" yq -r '.services[strenv(APP_NAME)].tag // ""')" = "$IMAGE_TAG" ]
                  [ "$(printf '%s\n' "$catalog_record" | APP_NAME="$app_name" yq -r '.services[strenv(APP_NAME)].repository // ""')" = "$HARBOR_REGISTRY/$HARBOR_PROJECT/$app_name" ]
                done
              }

              if [ "$RELEASE_STATUS" = "candidate" ]; then
                candidate_count="$(RELEASE_ID="$RELEASE_ID" yq -r '[.candidates[] | select(.id == strenv(RELEASE_ID))] | length' "$catalog")"
                [ "$candidate_count" -le 1 ]

                if [ "$candidate_count" -eq 1 ]; then
                  candidate_record="$(RELEASE_ID="$RELEASE_ID" yq -o=json -I=0 '.candidates[] | select(.id == strenv(RELEASE_ID))' "$catalog")"
                  validate_record "$candidate_record"
                else
                  [ "$UPDATE_CATALOG" = "true" ]
                  [ "$(yq -r '.status' "$catalog")" != "final" ]
                  active_candidate="$(yq -r '.activeCandidate // ""' "$catalog")"
                  if [ -n "$active_candidate" ]; then
                    escaped_catalog_id="$(printf '%s' "$catalog_id" | sed 's/\./\\./g')"
                    printf '%s\n' "$active_candidate" | grep -Eq "^${escaped_catalog_id}-rc\.[1-9][0-9]*$"
                    printf '%s\n' "$RELEASE_ID" | grep -Eq "^${escaped_catalog_id}-rc\.[1-9][0-9]*$"
                    [ "${RELEASE_ID##*.}" -gt "${active_candidate##*.}" ]
                  fi

                  UPDATED_AT="$now" RUN_URL="$run_url" WEBAPP_DIGEST="$webapp_digest" \
                  INTERNALAPI_DIGEST="$internalapi_digest" EXTERNALAPI_DIGEST="$externalapi_digest" yq -i '
                    .status = "candidate" |
                    .activeCandidate = strenv(RELEASE_ID) |
                    .updatedAt = strenv(UPDATED_AT) |
                    .candidates += [{
                      "id": strenv(RELEASE_ID),
                      "createdAt": strenv(UPDATED_AT),
                      "source": {
                        "branch": strenv(SOURCE_BRANCH),
                        "revision": strenv(SOURCE_REVISION)
                      },
                      "workflow": {
                        "repository": strenv(GITHUB_REPOSITORY),
                        "runId": strenv(GITHUB_RUN_ID),
                        "runAttempt": strenv(GITHUB_RUN_ATTEMPT),
                        "runUrl": strenv(RUN_URL)
                      },
                      "services": {
                        "webapp": {
                          "sourceCommit": strenv(SOURCE_REVISION),
                          "repository": strenv(HARBOR_REGISTRY) + "/" + strenv(HARBOR_PROJECT) + "/webapp",
                          "digest": strenv(WEBAPP_DIGEST),
                          "tag": strenv(IMAGE_TAG)
                        },
                        "internalapi": {
                          "sourceCommit": strenv(SOURCE_REVISION),
                          "repository": strenv(HARBOR_REGISTRY) + "/" + strenv(HARBOR_PROJECT) + "/internalapi",
                          "digest": strenv(INTERNALAPI_DIGEST),
                          "tag": strenv(IMAGE_TAG)
                        },
                        "externalapi": {
                          "sourceCommit": strenv(SOURCE_REVISION),
                          "repository": strenv(HARBOR_REGISTRY) + "/" + strenv(HARBOR_PROJECT) + "/externalapi",
                          "digest": strenv(EXTERNALAPI_DIGEST),
                          "tag": strenv(IMAGE_TAG)
                        }
                      }
                    }]
                  ' "$catalog"
                fi
              else
                [ "$RELEASE_ID" = "$catalog_id" ]
                if [ "$(yq -r '.final.id // ""' "$catalog")" = "$RELEASE_ID" ]; then
                  final_record="$(yq -o=json -I=0 '.final' "$catalog")"
                  validate_record "$final_record"
                else
                  [ "$UPDATE_CATALOG" = "true" ] || [ "$(yq -r '.candidates | length' "$catalog")" -eq 0 ]
                  [ "$(yq -r '.final == null' "$catalog")" = "true" ]

                  active_candidate="$(yq -r '.activeCandidate // ""' "$catalog")"
                  if [ -n "$active_candidate" ]; then
                    [ "$(RELEASE_ID="$active_candidate" yq -r '(.candidates[] | select(.id == strenv(RELEASE_ID))).source.revision // ""' "$catalog")" = "$SOURCE_REVISION" ]
                    for app_name in webapp internalapi externalapi; do
                      expected_digest="$(
                        printf '%s\n' "$ARTIFACT_SET" |
                          APP_NAME="$app_name" yq -r '.[] | select(.app_name == strenv(APP_NAME)) | .digest'
                      )"
                      [ "$(RELEASE_ID="$active_candidate" APP_NAME="$app_name" yq -r '(.candidates[] | select(.id == strenv(RELEASE_ID))).services[strenv(APP_NAME)].digest // ""' "$catalog")" = "$expected_digest" ]
                    done
                  fi

                  UPDATED_AT="$now" RUN_URL="$run_url" WEBAPP_DIGEST="$webapp_digest" \
                  INTERNALAPI_DIGEST="$internalapi_digest" EXTERNALAPI_DIGEST="$externalapi_digest" yq -i '
                    .status = "final" |
                    .updatedAt = strenv(UPDATED_AT) |
                    .final = {
                      "id": strenv(RELEASE_ID),
                      "createdAt": strenv(UPDATED_AT),
                      "source": {
                        "branch": strenv(SOURCE_BRANCH),
                        "revision": strenv(SOURCE_REVISION)
                      },
                      "workflow": {
                        "repository": strenv(GITHUB_REPOSITORY),
                        "runId": strenv(GITHUB_RUN_ID),
                        "runAttempt": strenv(GITHUB_RUN_ATTEMPT),
                        "runUrl": strenv(RUN_URL)
                      },
                      "services": {
                        "webapp": {
                          "sourceCommit": strenv(SOURCE_REVISION),
                          "repository": strenv(HARBOR_REGISTRY) + "/" + strenv(HARBOR_PROJECT) + "/webapp",
                          "digest": strenv(WEBAPP_DIGEST),
                          "tag": strenv(IMAGE_TAG)
                        },
                        "internalapi": {
                          "sourceCommit": strenv(SOURCE_REVISION),
                          "repository": strenv(HARBOR_REGISTRY) + "/" + strenv(HARBOR_PROJECT) + "/internalapi",
                          "digest": strenv(INTERNALAPI_DIGEST),
                          "tag": strenv(IMAGE_TAG)
                        },
                        "externalapi": {
                          "sourceCommit": strenv(SOURCE_REVISION),
                          "repository": strenv(HARBOR_REGISTRY) + "/" + strenv(HARBOR_PROJECT) + "/externalapi",
                          "digest": strenv(EXTERNALAPI_DIGEST),
                          "tag": strenv(IMAGE_TAG)
                        }
                      }
                    }
                  ' "$catalog"
                fi
              fi

              file_pattern="${file_pattern},${catalog_path}"
            fi

            printf 'file_pattern=%s\n' "$file_pattern" >> "$GITHUB_OUTPUT"

      # Reviewed environments reach Argo CD only after this pull request is merged.
      - name: Create GitOps pull request
        if: inputs.create_pr
        id: create-pr
        uses: peter-evans/create-pull-request@v7.0.11
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          base: ${{ env.GITOPS_BRANCH }}
          branch: ${{ steps.gitops-pr-branch.outputs.branch }}
          delete-branch: true
          commit-message: ${{ inputs.commit_message }}
          title: ${{ inputs.commit_message }}
          body: |
            Promotes Nexum `${{ inputs.release_id }}` from `${{ inputs.promoted_from }}` to `${{ inputs.target_environment }}`.

            Source commit: [`${{ steps.source-commit.outputs.short_revision }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ inputs.source_revision }}) - ${{ steps.source-commit.outputs.subject }}
            Source branch: `${{ inputs.source_branch }}`
            Full source revision: `${{ inputs.source_revision }}`
            Release status: `${{ inputs.release_status }}`

            Artifact set:
            ```json
            ${{ inputs.artifact_set }}
            ```
          add-paths: ${{ steps.update-values.outputs.file_pattern }}
          committer: nexum-gitops[bot] <nexum-gitops@pegasus.local>
          author: nexum-gitops[bot] <nexum-gitops@pegasus.local>

      - name: Push GitOps values directly
        if: ${{ !inputs.create_pr }}
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          FILE_PATTERN: ${{ steps.update-values.outputs.file_pattern }}
        run: |
          set -euo pipefail

          git -C gitops config user.name "nexum-gitops[bot]"
          git -C gitops config user.email "nexum-gitops@pegasus.local"
          IFS=',' read -r -a changed_paths <<< "$FILE_PATTERN"
          git -C gitops add -- "${changed_paths[@]}"

          git -C gitops diff --cached --quiet && exit 0
          git -C gitops commit -m "$COMMIT_MESSAGE"

          max_attempts=3
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            echo "GitOps push attempt $attempt/$max_attempts"
            git -C gitops fetch origin "$GITOPS_BRANCH"

            if ! git -C gitops rebase "origin/$GITOPS_BRANCH"; then
              git -C gitops rebase --abort || true
              echo "GitOps rebase conflict. Refusing to overwrite concurrent changes."
              exit 1
            fi

            if git -C gitops push origin "HEAD:${GITOPS_BRANCH}"; then
              exit 0
            fi

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "GitOps main changed during all $max_attempts push attempts."
              exit 1
            fi

            echo "GitOps main changed during push; retrying in 2 seconds."
            sleep 2
          done