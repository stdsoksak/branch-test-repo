name: Backport Hotfix
on:
  pull_request:
    branches: [main]
    types: [closed]
permissions:
  contents: write
  pull-requests: write
jobs:
  backport:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'hotfix-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop-nd
          fetch-depth: 0
      - name: Cherry-pick hotfix into a backport branch
        id: bp
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          HOTFIX: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH="backport-${HOTFIX}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          PARENTS=$(git rev-list --parents -n1 "$MERGE_SHA" | awk '{print NF-1}')
          if [[ "$PARENTS" -gt 1 ]]; then git cherry-pick -m 1 "$MERGE_SHA"; else git cherry-pick "$MERGE_SHA"; fi
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Open PR to develop-nd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.bp.outputs.branch }}
          HOTFIX: ${{ github.event.pull_request.head.ref }}
        run: gh pr create --base develop-nd --head "$BRANCH" --title "Backport $HOTFIX to develop-nd" --body 'Automatic post-production hotfix backport.'
      - run: |
          echo 'A PR created by GITHUB_TOKEN may require a maintainer to approve its CI run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Use a GitHub App token later if fully automatic backport PR CI is required.' >> "$GITHUB_STEP_SUMMARY"
