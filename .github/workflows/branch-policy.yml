name: Branch Policy
on:
  pull_request:
permissions:
  contents: read
jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate merge path
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          ok=false
          if [[ "$BASE" == "develop-nd" && "$HEAD" =~ ^(feature|bugfix|chore|backport-hotfix)- ]]; then ok=true; fi
          if [[ "$BASE" == "validation-nt" && "$HEAD" == "develop-nd" ]]; then ok=true; fi
          if [[ "$BASE" =~ ^release-ct-v[0-9]+\.[0-9]+\.[0-9]+$ && "$HEAD" =~ ^releasefix- ]]; then ok=true; fi
          if [[ "$BASE" == "main" && "$HEAD" =~ ^(release-ct-v[0-9]+\.[0-9]+\.[0-9]+|hotfix-v[0-9]+\.[0-9]+\.[0-9]+-.+)$ ]]; then ok=true; fi
          [[ "$ok" == true ]] || { echo "Not allowed: $HEAD -> $BASE"; exit 1; }
          echo "Allowed: $HEAD -> $BASE"
