name: CD - Production | Promote WEBCT to Production
run-name: Production | Promote ${{ inputs.version }} from WEBCT

on:
  workflow_dispatch:
    inputs:
      version:
        description: Final version whose active WEBCT candidate is approved (example 1.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: nexum-cd
  cancel-in-progress: false

env:
  GITOPS_OWNER: stdsoksak
  GITOPS_REPOSITORY: test-gitops
  GITOPS_BRANCH: main
  GITOPS_PROJECT_PATH: nexum/argocd/environments
  GITOPS_RELEASE_PATH: nexum/releases

jobs:
  finalize-release:
    name: Validate WEBCT Candidate
    runs-on: nexum-project-local

    outputs:
      version: ${{ steps.release.outputs.version }}
      release_branch: ${{ steps.release.outputs.branch }}
      candidate_id: ${{ steps.webct_candidate.outputs.result }}
      source_revision: ${{ steps.candidate_source.outputs.source_revision }}

    steps:
      - name: Require main
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" == "main" ]] || {
            echo "Production workflow must be run from main."
            exit 1
          }

      - name: Normalize version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=release/v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_OWNER }}/${{ env.GITOPS_REPOSITORY }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          fetch-depth: 0
          persist-credentials: false

      - name: Read WEBCT candidate ID
        id: webct_candidate
        uses: mikefarah/yq@v4.53.6
        with:
          cmd: yq -r '.deployment.labels."nexum.pegasusum.com/release-id" // ""' 'gitops/${{ env.GITOPS_PROJECT_PATH }}/webct/webapp/values.yaml'

      - name: Read candidate source revision
        id: candidate_source
        uses: mikefarah/yq@v4.53.6
        env:
          CANDIDATE_ID: ${{ steps.webct_candidate.outputs.result }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        with:
          cmd: |
            set -eu
            escaped_version="$(printf '%s' "$EXPECTED_VERSION" | sed 's/\./\\./g')"
            printf '%s\n' "$CANDIDATE_ID" | grep -Eq "^${escaped_version}-rc\.[1-9][0-9]*$"
            catalog="gitops/$GITOPS_RELEASE_PATH/$EXPECTED_VERSION.yaml"
            [ -f "$catalog" ]
            [ "$(yq -r '.activeCandidate // ""' "$catalog")" = "$CANDIDATE_ID" ]
            [ "$(CANDIDATE_ID="$CANDIDATE_ID" yq -r '[.candidates[] | select(.id == strenv(CANDIDATE_ID))] | length' "$catalog")" -eq 1 ]
            source_revision="$(CANDIDATE_ID="$CANDIDATE_ID" yq -r '(.candidates[] | select(.id == strenv(CANDIDATE_ID))).source.revision // ""' "$catalog")"
            printf '%s\n' "$source_revision" | grep -Eq '^[0-9a-f]{40}$'
            echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Promote WEBCT to Production
    needs: finalize-release
    uses: ./.github/workflows/promote-environment.yml
    with:
      source_environment: webct
      target_environment: prod
      source_branch: ${{ needs.finalize-release.outputs.release_branch }}
      version: ${{ needs.finalize-release.outputs.version }}
      release_id: ${{ needs.finalize-release.outputs.version }}
      release_status: final
      create_catalog: true
      catalog_id: ${{ needs.finalize-release.outputs.version }}
      update_catalog: true
      target_image_tag: ${{ needs.finalize-release.outputs.version }}
      expected_source_release_id: ${{ needs.finalize-release.outputs.candidate_id }}
      expected_source_revision: ${{ needs.finalize-release.outputs.source_revision }}
      expected_source_status: candidate
    secrets: inherit

  tag-release:
    name: Tag Source Revision
    needs:
      - finalize-release
      - deploy-production
    runs-on: nexum-project-local

    steps:
      - name: Checkout final source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.finalize-release.outputs.source_revision }}
          fetch-depth: 0

      - name: Create immutable release tag
        shell: bash
        env:
          VERSION: ${{ needs.finalize-release.outputs.version }}
          SOURCE_REVISION: ${{ needs.finalize-release.outputs.source_revision }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          existing="$(git rev-parse -q --verify "refs/tags/${VERSION}^{commit}" || true)"

          if [[ -n "$existing" && "$existing" != "$SOURCE_REVISION" ]]; then
            echo "$VERSION already points to a different source revision."
            exit 1
          fi

          if [[ -z "$existing" ]]; then
            git tag "$VERSION" "$SOURCE_REVISION"
            git push origin "refs/tags/$VERSION"
          fi

          {
            echo "## Production release tag"
            echo "- Tag: \`$VERSION\`"
            echo "- Source revision: \`$SOURCE_REVISION\`"
          } >> "$GITHUB_STEP_SUMMARY"
