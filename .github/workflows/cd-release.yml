name: CD - Release | Promote to WEBCT
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('WEBCT | Start {0} from tested WEBNT artifacts', inputs.version)
      || format('WEBCT | Process release PR #{0}', github.event.pull_request.number) }}

on:
  pull_request:
    types:
      - closed
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      version:
        description: Existing release/vX.Y.Z branch version; its HEAD must match current WEBNT (example 1.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: nexum-cd
  cancel-in-progress: false

env:
  HARBOR_REGISTRY: registry.kube-system.svc.cluster.local:80
  HARBOR_PROJECT: nexum
  GITOPS_OWNER: stdsoksak
  GITOPS_REPOSITORY: test-gitops
  GITOPS_BRANCH: main
  GITOPS_PROJECT_PATH: nexum/argocd/environments
  GITOPS_RELEASE_PATH: nexum/releases

jobs:
  prepare-release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: Prepare Release Candidate
    runs-on: nexum-project-local

    outputs:
      version: ${{ steps.metadata.outputs.version }}
      branch: ${{ steps.metadata.outputs.branch }}
      release_id: ${{ steps.metadata.outputs.release_id }}
      source_revision: ${{ steps.metadata.outputs.source_revision }}
      source_release_id: ${{ steps.webnt.outputs.release_id }}

    steps:
      - name: Checkout Nexum
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout GitOps repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_OWNER }}/${{ env.GITOPS_REPOSITORY }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve release identity
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION#v}"
            RELEASE_BRANCH="release/v${VERSION}"
          else
            RELEASE_BRANCH="$PR_BASE_BRANCH"
            [[ "$RELEASE_BRANCH" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
              echo "Release branch must look like release/v1.2.0"
              exit 1
            }
            VERSION="${BASH_REMATCH[1]}"
          fi

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must look like 1.2.0"
            exit 1
          }

          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Require an active newer release version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          requested="${REQUESTED_VERSION#v}"
          IFS=. read -r requested_major requested_minor requested_patch <<< "$requested"
          requested_major=$((10#$requested_major))
          requested_minor=$((10#$requested_minor))
          requested_patch=$((10#$requested_patch))

          latest_tag=""
          latest_major=-1
          latest_minor=-1
          latest_patch=-1

          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major=$((10#${BASH_REMATCH[1]}))
              minor=$((10#${BASH_REMATCH[2]}))
              patch=$((10#${BASH_REMATCH[3]}))
            elif [[ "$tag" =~ ^hotfix-v([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?$ ]]; then
              major=$((10#${BASH_REMATCH[1]}))
              minor=$((10#${BASH_REMATCH[2]}))
              patch=$((10#${BASH_REMATCH[3]}))
            else
              continue
            fi

            if (( major > latest_major ||
                  major == latest_major && minor > latest_minor ||
                  major == latest_major && minor == latest_minor && patch > latest_patch )); then
              latest_tag="$tag"
              latest_major=$major
              latest_minor=$minor
              latest_patch=$patch
            fi
          done < <(git tag --list)

          if [[ -n "$latest_tag" ]] &&
             (( requested_major < latest_major ||
                requested_major == latest_major && requested_minor < latest_minor ||
                requested_major == latest_major && requested_minor == latest_minor && requested_patch <= latest_patch )); then
            echo "Requested $REQUESTED_VERSION must be newer than $latest_tag."
            exit 1
          fi

      - name: Prepare pending WEBCT catalog snapshot
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          pending_branch="gitops/nexum-webct-${VERSION}"
          catalog_path="$GITOPS_RELEASE_PATH/$VERSION.yaml"
          pending_catalog="gitops/.pending-release-catalog.yaml"
          rm -f "$pending_catalog"

          if git -C gitops ls-remote --exit-code --heads origin "refs/heads/$pending_branch" >/dev/null 2>&1; then
            git -C gitops fetch origin "refs/heads/$pending_branch:refs/remotes/origin/$pending_branch"
            if git -C gitops cat-file -e "origin/$pending_branch:$catalog_path" 2>/dev/null; then
              git -C gitops show "origin/$pending_branch:$catalog_path" > "$pending_catalog"
            fi
          fi

      - name: Read current release catalog
        id: current_catalog
        uses: mikefarah/yq@v4.53.6
        env:
          VERSION: ${{ steps.release.outputs.version }}
        with:
          cmd: |
            set -eu
            catalog="gitops/$GITOPS_RELEASE_PATH/$VERSION.yaml"
            if [ -f "$catalog" ]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "release_id=$(yq -r '.activeCandidate // ""' "$catalog")" >> "$GITHUB_OUTPUT"
              echo "status=$(yq -r '.status // ""' "$catalog")" >> "$GITHUB_OUTPUT"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "release_id=" >> "$GITHUB_OUTPUT"
              echo "status=" >> "$GITHUB_OUTPUT"
            fi

            pending_catalog="gitops/.pending-release-catalog.yaml"
            if [ -f "$pending_catalog" ]; then
              [ "$(yq -r '.version // ""' "$pending_catalog")" = "$VERSION" ]
              [ "$(yq -r '.status // ""' "$pending_catalog")" = "candidate" ]
              echo "pending_release_id=$(yq -r '.activeCandidate // ""' "$pending_catalog")" >> "$GITHUB_OUTPUT"
            else
              echo "pending_release_id=" >> "$GITHUB_OUTPUT"
            fi

      - name: Read WEBNT build metadata
        if: github.event_name == 'workflow_dispatch'
        id: webnt
        uses: mikefarah/yq@v4.53.6
        with:
          cmd: |
            set -eu

            release_id=""
            source_revision=""
            for app_name in webapp internalapi externalapi; do
              values="gitops/$GITOPS_PROJECT_PATH/webnt/$app_name/values.yaml"
              app_release_id="$(yq -r '.deployment.labels."nexum.pegasusum.com/release-id" // ""' "$values")"
              app_revision="$(yq -r '.deployment.labels."nexum.pegasusum.com/source-revision" // ""' "$values")"

              if [ -z "$release_id" ]; then
                release_id="$app_release_id"
                source_revision="$app_revision"
              else
                [ "$app_release_id" = "$release_id" ] || { echo "$app_name release ID differs"; exit 1; }
                [ "$app_revision" = "$source_revision" ] || { echo "$app_name source revision differs"; exit 1; }
              fi
            done

            printf '%s\n' "$release_id" | grep -Eq '^git-[0-9a-f]{7,40}$'
            printf '%s\n' "$source_revision" | grep -Eq '^[0-9a-f]{40,64}$'
            echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
            echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"

      - name: Prepare release candidate metadata
        id: metadata
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          CURRENT_CATALOG_EXISTS: ${{ steps.current_catalog.outputs.exists }}
          CURRENT_RELEASE_ID: ${{ steps.current_catalog.outputs.release_id }}
          CURRENT_STATUS: ${{ steps.current_catalog.outputs.status }}
          PENDING_RELEASE_ID: ${{ steps.current_catalog.outputs.pending_release_id }}
          MERGE_REVISION: ${{ github.event.pull_request.merge_commit_sha }}
          WEBNT_SOURCE_REVISION: ${{ steps.webnt.outputs.source_revision }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            SOURCE_REVISION="$WEBNT_SOURCE_REVISION"
            git cat-file -e "${SOURCE_REVISION}^{commit}"
          else
            [[ "$MERGE_REVISION" =~ ^[0-9a-f]{40,64}$ ]]
            git fetch origin "$MERGE_REVISION"
            git cat-file -e "${MERGE_REVISION}^{commit}"
            SOURCE_REVISION="$MERGE_REVISION"
          fi

          [[ -z "$CURRENT_STATUS" || "$CURRENT_STATUS" == "candidate" ]] || {
            echo "$VERSION is already finalized."
            exit 1
          }

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_id="${VERSION}-rc.1"
            [[ -z "$CURRENT_RELEASE_ID" || "$CURRENT_RELEASE_ID" == "$release_id" ]] || {
              echo "$VERSION already has active candidate $CURRENT_RELEASE_ID."
              exit 1
            }
          else
            [[ "$CURRENT_CATALOG_EXISTS" == "true" && "$CURRENT_STATUS" == "candidate" && -n "$CURRENT_RELEASE_ID" ]] || {
              echo "$VERSION has no active release catalog on GitOps main."
              echo "Initialize it from tested WEBNT artifacts before publishing release-branch changes."
              exit 1
            }
            [[ "$CURRENT_RELEASE_ID" =~ ^${VERSION//./\.}-rc\.([1-9][0-9]*)$ ]] || {
              echo "Invalid candidate ID in $VERSION catalog: $CURRENT_RELEASE_ID"
              exit 1
            }
            max_rc="${BASH_REMATCH[1]}"

            if [[ -n "$PENDING_RELEASE_ID" ]]; then
              [[ "$PENDING_RELEASE_ID" =~ ^${VERSION//./\.}-rc\.([1-9][0-9]*)$ ]] || {
                echo "Invalid candidate ID in pending $VERSION catalog: $PENDING_RELEASE_ID"
                exit 1
              }
              (( BASH_REMATCH[1] > max_rc )) && max_rc="${BASH_REMATCH[1]}"
            fi

            release_id="${VERSION}-rc.$((max_rc + 1))"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "source_revision=$SOURCE_REVISION" >> "$GITHUB_OUTPUT"

      - name: Validate release branch against WEBNT revision
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_BRANCH: ${{ steps.metadata.outputs.branch }}
          SOURCE_REVISION: ${{ steps.metadata.outputs.source_revision }}
        run: |
          set -euo pipefail

          branch_revision="$(git ls-remote --heads origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')"
          [[ -n "$branch_revision" ]] || {
            echo "$RELEASE_BRANCH does not exist. Create it from tested WEBNT revision $SOURCE_REVISION, then rerun this workflow."
            exit 1
          }
          [[ "$branch_revision" == "$SOURCE_REVISION" ]] || {
            echo "$RELEASE_BRANCH does not match the tested WEBNT revision."
            echo "Release branch: $branch_revision"
            echo "WEBNT revision : $SOURCE_REVISION"
            exit 1
          }

      - name: Write release preparation summary
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
          VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_ID: ${{ steps.metadata.outputs.release_id }}
          RELEASE_BRANCH: ${{ steps.metadata.outputs.branch }}
          SOURCE_REVISION: ${{ steps.metadata.outputs.source_revision }}
          SOURCE_RELEASE_ID: ${{ steps.webnt.outputs.release_id }}
        run: |
          {
            echo "## Release Candidate Preparation"
            echo "- Result: \`$RESULT\`"
            echo "- Trigger: \`$GITHUB_EVENT_NAME\`"
            echo "- Version: \`${VERSION:-unresolved}\`"
            echo "- Candidate: \`${RELEASE_ID:-unresolved}\`"
            echo "- Release branch: \`${RELEASE_BRANCH:-unresolved}\`"
            echo "- Source revision: \`${SOURCE_REVISION:-unresolved}\`"
            if [[ -n "$SOURCE_RELEASE_ID" ]]; then
              echo "- Promoted from WEBNT build: \`$SOURCE_RELEASE_ID\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-webapp:
    if: github.event_name == 'pull_request'
    needs: prepare-release
    uses: ./.github/workflows/_build-image.yml
    with:
      source_revision: ${{ needs.prepare-release.outputs.source_revision }}
      image_name: webapp
      dockerfile: Dockerfile_project1
    secrets: inherit

  build-internalapi:
    if: github.event_name == 'pull_request'
    needs: prepare-release
    uses: ./.github/workflows/_build-image.yml
    with:
      source_revision: ${{ needs.prepare-release.outputs.source_revision }}
      image_name: internalapi
      dockerfile: Dockerfile_project2
    secrets: inherit

  build-externalapi:
    if: github.event_name == 'pull_request'
    needs: prepare-release
    uses: ./.github/workflows/_build-image.yml
    with:
      source_revision: ${{ needs.prepare-release.outputs.source_revision }}
      image_name: externalapi
      dockerfile: Dockerfile_project3
    secrets: inherit

  tag-release-candidate:
    if: github.event_name == 'pull_request'
    name: Create immutable RC aliases
    needs:
      - prepare-release
      - build-webapp
      - build-internalapi
      - build-externalapi
    runs-on: nexum-project-local
    environment: webct

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          driver-opts: |
            network=host
          buildkitd-config-inline: |
            [registry."${{ env.HARBOR_REGISTRY }}"]
              http = true
              insecure = true

      - name: Create RC aliases from immutable digests
        shell: bash
        env:
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          WEBAPP_DIGEST: ${{ needs.build-webapp.outputs.digest }}
          INTERNALAPI_DIGEST: ${{ needs.build-internalapi.outputs.digest }}
          EXTERNALAPI_DIGEST: ${{ needs.build-externalapi.outputs.digest }}
        run: |
          set -euo pipefail

          alias_image() {
            local app="$1"
            local digest="$2"
            local repository="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${app}"
            local existing

            existing="$(docker buildx imagetools inspect "${repository}:${RELEASE_ID}" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)"
            [[ -z "$existing" || "$existing" == "$digest" ]] || { echo "RC tag conflict for $app"; exit 1; }
            [[ -n "$existing" ]] || docker buildx imagetools create --tag "${repository}:${RELEASE_ID}" "${repository}@${digest}"
          }

          alias_image webapp "$WEBAPP_DIGEST"
          alias_image internalapi "$INTERNALAPI_DIGEST"
          alias_image externalapi "$EXTERNALAPI_DIGEST"

      - name: Write release candidate image summary
        shell: bash
        env:
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          SOURCE_REVISION: ${{ needs.prepare-release.outputs.source_revision }}
        run: |
          {
            echo "## Release Candidate Images"
            echo "- Candidate: \`$RELEASE_ID\`"
            echo "- Source revision: [\`${SOURCE_REVISION:0:12}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SOURCE_REVISION})"
            echo "- Services: \`webapp\`, \`internalapi\`, \`externalapi\`"
            echo "- Harbor aliases: Created and verified"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-initial-release-candidate:
    if: github.event_name == 'workflow_dispatch'
    name: Promote WEBNT as Initial Release Candidate
    needs: prepare-release
    uses: ./.github/workflows/promote-environment.yml
    with:
      source_environment: webnt
      target_environment: webct
      source_branch: ${{ needs.prepare-release.outputs.branch }}
      version: ${{ needs.prepare-release.outputs.version }}
      release_id: ${{ needs.prepare-release.outputs.release_id }}
      release_status: candidate
      create_catalog: true
      catalog_id: ${{ needs.prepare-release.outputs.version }}
      update_catalog: true
      target_image_tag: ${{ needs.prepare-release.outputs.release_id }}
      expected_source_release_id: ${{ needs.prepare-release.outputs.source_release_id }}
      expected_source_revision: ${{ needs.prepare-release.outputs.source_revision }}
      expected_source_status: build
    secrets: inherit

  deploy-updated-release-candidate:
    if: github.event_name == 'pull_request'
    name: Propose Updated Release Candidate to WEBCT
    needs:
      - prepare-release
      - build-webapp
      - build-internalapi
      - build-externalapi
      - tag-release-candidate
    uses: ./.github/workflows/_update-gitops-values.yml
    with:
      target_environment: webct
      release_id: ${{ needs.prepare-release.outputs.release_id }}
      release_status: candidate
      create_catalog: true
      catalog_id: ${{ needs.prepare-release.outputs.version }}
      update_catalog: true
      artifact_set: >-
        [
          {"app_name":"webapp","digest":"${{ needs.build-webapp.outputs.digest }}"},
          {"app_name":"internalapi","digest":"${{ needs.build-internalapi.outputs.digest }}"},
          {"app_name":"externalapi","digest":"${{ needs.build-externalapi.outputs.digest }}"}
        ]
      image_tag: ${{ needs.prepare-release.outputs.release_id }}
      version: ${{ needs.prepare-release.outputs.version }}
      source_branch: ${{ needs.prepare-release.outputs.branch }}
      source_revision: ${{ needs.prepare-release.outputs.source_revision }}
      promoted_from: release-build
      commit_message: "chore(nexum): propose ${{ needs.prepare-release.outputs.release_id }} to WEBCT"
    secrets: inherit
