name: Create CT Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without v, e.g. 1.0.0
        required: true
        type: string
permissions:
  contents: write
  packages: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    environment: webct
    steps:
      - uses: actions/checkout@v6
        with:
          ref: validation-nt
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release branch and promote WEBNT digest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          source scripts/lib.sh
          IMAGE=$(image_name)
          BRANCH="release-ct-v${VERSION}"
          RELEASE="release-v${VERSION}"

          resolve_digest "$IMAGE:env-webnt" >/dev/null

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
          fi

          RELEASE_DIGEST=$(promote_image "$IMAGE" env-webnt "$RELEASE")
          WEBCT=$(promote_image "$IMAGE" "$RELEASE" env-webct)
          [[ "$RELEASE_DIGEST" == "$WEBCT" ]]

          echo "### CT release" >> "$GITHUB_STEP_SUMMARY"
          echo "- branch: \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: \`$RELEASE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest: \`$WEBCT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- rebuild: **no**" >> "$GITHUB_STEP_SUMMARY"
