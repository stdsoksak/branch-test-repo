name: Develop Flow
on:
  pull_request:
    branches: [develop-nd]
  push:
    branches: [develop-nd]
permissions:
  contents: read
  packages: write
jobs:
  code-ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/test.sh
      - run: |
          echo 'Static/security tooling placeholder.'
          echo 'Replace later with approved static analysis, dependency, secret and container checks.'

  build-webnd:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: webnd
    concurrency:
      group: webnd
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once and mark WEBND
        run: |
          source scripts/lib.sh
          IMAGE=$(image_name)
          DIGEST=$(ensure_image "$IMAGE" "$GITHUB_SHA")
          WEBND=$(promote_image "$IMAGE" "git-${GITHUB_SHA}" env-webnd)
          [[ "$DIGEST" == "$WEBND" ]]
          echo "### WEBND" >> "$GITHUB_STEP_SUMMARY"
          echo "- git SHA: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest: \`$WEBND\`" >> "$GITHUB_STEP_SUMMARY"
