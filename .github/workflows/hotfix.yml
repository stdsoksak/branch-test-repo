name: Hotfix Candidate
on:
  push:
    branches: ['hotfix-*']
permissions:
  contents: read
  packages: write
jobs:
  build-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          source scripts/lib.sh
          IMAGE=$(image_name)
          DIGEST=$(ensure_image "$IMAGE" "$GITHUB_SHA")
          echo "Hotfix candidate: $IMAGE:git-$GITHUB_SHA -> $DIGEST"
