name: "Kubernetes Secret Injection"

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inject-secrets:
    name: "Inject Kubernetes Secrets"
    runs-on: nexum-project-local

    container:
      image: mcr.microsoft.com/azure-cli:latest
      options: --user 0
    environment:
      name: nexum-test

    env:
      AZURE_RESOURCE_GROUP: FLYPGS-NEXUMTEST-RG
      AKS_CLUSTER_NAME: NexumTestCluster
      TARGET_NS: nexum
      ALL_SECRETS_JSON: ${{ toJSON(secrets) }}

    steps:
      # -------------------------------------------------------
      # Container Tools
      # -------------------------------------------------------

      - name: "Prepare Azure/Kubernetes Tools"
        run: |
          set -euo pipefail

          echo "Azure CLI:"
          az version

          echo "Installing kubectl + kubelogin..."
          az aks install-cli \
            --install-location /usr/local/bin/kubectl \
            --kubelogin-install-location /usr/local/bin/kubelogin

          echo "Installed tools:"
          command -v az
          command -v kubectl
          command -v kubelogin
          command -v jq

          kubectl version --client
          kubelogin --version
          jq --version

      # -------------------------------------------------------
      # Azure OIDC Login
      # -------------------------------------------------------
      - name: "Azure Login"
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # -------------------------------------------------------
      # AKS Context
      # -------------------------------------------------------
      - name: "Set AKS Context"
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          admin: false
          use-kubelogin: true

      # -------------------------------------------------------
      # Connection Test
      # -------------------------------------------------------
      - name: "Verify AKS Access"
        run: |
          set -euo pipefail

          echo "Current Kubernetes context:"
          kubectl config current-context

          echo "Cluster info:"
          kubectl cluster-info

          echo "Nodes:"
          kubectl get nodes

      # -------------------------------------------------------
      # Namespace
      # -------------------------------------------------------
      - name: "Ensure Namespace Exists"
        run: |
          set -euo pipefail

          kubectl create namespace "$TARGET_NS" \
            --dry-run=client \
            -o yaml \
            | kubectl apply -f -

      # -------------------------------------------------------
      # WEBAPP
      # -------------------------------------------------------
      - name: "Inject WebApp Secrets"
        env:
          SECRET_NAME: webapp-secrets
        run: |
          set -euo pipefail

          REQUIRED_KEYS='[
            "JWTSETTINGS__SIGNINGKEY",
            "CONNECTIONSTRINGS__MSSQL",
            "CONNECTIONSTRINGS__READMSSQL",
            "CONNECTIONSTRINGS__REDIS",
            "SERVICE__APIKEY",
            "RECAPTCHA__LOGINSITEKEY",
            "RECAPTCHA__LOGINSECRETKEY",
            "RECAPTCHA__TESTSITEKEY",
            "RECAPTCHA__TESTSECRETKEY",
            "RECAPTCHA__GLOBALSITEKEY",
            "RECAPTCHA__GLOBALSECRETKEY",
            "RECAPTCHA__V3SITEKEY",
            "RECAPTCHA__V3SECRETKEY",
            "TRIPLEDES__KEY",
            "TRIPLEDES__IV",
            "SALESFORCE__CLIENTID_DEV",
            "SALESFORCE__CLIENTSECRET",
            "SALESFORCE__PASSWORD_DEV",
            "PAXFFSERVICE__CLIENTSECRET",
            "PAXKCSERVICE__CLIENTSECRET",
            "PAXSERVICE__PASSWORD",
            "PAXFFSERVICE__TESTCLIENTSECRET",
            "PAXSERVICE__TOKEN",
            "PAXFFSERVICE__REFRESHTOKEN",
            "PAXKCSERVICE__TESTCLIENTSECRET",
            "PAXKCSERVICE__PRODCLIENTSECRET",
            "PAXKCSERVICE__PRODPASSWORD",
            "TYPESENSE__APIKEY",
            "AIAZURE__SECRETKEY",
            "SECRETKEYS__CBOTSECRETKEY",
            "OPENWEATHER__APIKEY",
            "HEADERS__TOKEN1",
            "HEADERS__TOKEN2"
          ]'

          APP_SECRETS=$(jq -c \
            --argjson required "$REQUIRED_KEYS" '
              with_entries(
                select(
                  .key as $key
                  | $required
                  | index($key)
                )
              )
            ' <<< "$ALL_SECRETS_JSON")

          MISSING_KEYS=$(jq -cn \
            --argjson required "$REQUIRED_KEYS" \
            --argjson actual "$APP_SECRETS" '
              $required - ($actual | keys)
            ')

          MISSING_COUNT=$(jq 'length' <<< "$MISSING_KEYS")

          if [[ "$MISSING_COUNT" -ne 0 ]]; then
            echo "::error::WebApp için gerekli GitHub Secrets değerlerinden bazıları eksik."
            echo "Eksik keyler:"
            jq -r '.[]' <<< "$MISSING_KEYS"
            exit 1
          fi

          SECRET_COUNT=$(jq 'length' <<< "$APP_SECRETS")

          jq -n \
            --arg name "$SECRET_NAME" \
            --arg ns "$TARGET_NS" \
            --argjson secrets "$APP_SECRETS" \
            '{
              apiVersion: "v1",
              kind: "Secret",
              metadata: {
                name: $name,
                namespace: $ns
              },
              type: "Opaque",
              stringData: $secrets
            }' \
            | kubectl apply -f -

          echo "**webapp-secrets** oluşturuldu/güncellendi: $SECRET_COUNT key." \
            >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------
      # EXTERNAL API
      # -------------------------------------------------------
      - name: "Inject External API Secrets"
        env:
          SECRET_NAME: externalapi-secrets
        run: |
          set -euo pipefail

          REQUIRED_KEYS='[
            "JWTSETTINGS__SIGNINGKEY",
            "CONNECTIONSTRINGS__MSSQL",
            "CONNECTIONSTRINGS__READMSSQL",
            "CONNECTIONSTRINGS__REDIS",
            "HEADERS__TOKEN1",
            "HEADERS__TOKEN2"
          ]'

          APP_SECRETS=$(jq -c \
            --argjson required "$REQUIRED_KEYS" '
              with_entries(
                select(
                  .key as $key
                  | $required
                  | index($key)
                )
              )
            ' <<< "$ALL_SECRETS_JSON")

          MISSING_KEYS=$(jq -cn \
            --argjson required "$REQUIRED_KEYS" \
            --argjson actual "$APP_SECRETS" '
              $required - ($actual | keys)
            ')

          MISSING_COUNT=$(jq 'length' <<< "$MISSING_KEYS")

          if [[ "$MISSING_COUNT" -ne 0 ]]; then
            echo "::error::External API için gerekli GitHub Secrets değerlerinden bazıları eksik."
            echo "Eksik keyler:"
            jq -r '.[]' <<< "$MISSING_KEYS"
            exit 1
          fi

          SECRET_COUNT=$(jq 'length' <<< "$APP_SECRETS")

          jq -n \
            --arg name "$SECRET_NAME" \
            --arg ns "$TARGET_NS" \
            --argjson secrets "$APP_SECRETS" \
            '{
              apiVersion: "v1",
              kind: "Secret",
              metadata: {
                name: $name,
                namespace: $ns
              },
              type: "Opaque",
              stringData: $secrets
            }' \
            | kubectl apply -f -

          echo "**externalapi-secrets** oluşturuldu/güncellendi: $SECRET_COUNT key." \
            >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------
      # INTERNAL API
      # -------------------------------------------------------
      - name: "Inject Internal API Secrets"
        env:
          SECRET_NAME: internalapi-secrets
        run: |
          set -euo pipefail

          REQUIRED_KEYS='[
            "JWTSETTINGS__SIGNINGKEY",
            "CONNECTIONSTRINGS__MSSQL",
            "CONNECTIONSTRINGS__READMSSQL",
            "CONNECTIONSTRINGS__REDIS",
            "TYPESENSE__APIKEY",
            "AIAZURE__SECRETKEY",
            "SALESFORCE__CLIENTID_DEV",
            "SALESFORCE__CLIENTSECRET",
            "SALESFORCE__PASSWORD_DEV",
            "TRIPLEDES__KEY",
            "TRIPLEDES__IV",
            "SECRETKEYS__CBOTSECRETKEY",
            "RECAPTCHA__LOGINSITEKEY",
            "RECAPTCHA__LOGINSECRETKEY",
            "RECAPTCHA__TESTSITEKEY",
            "RECAPTCHA__TESTSECRETKEY",
            "RECAPTCHA__GLOBALSITEKEY",
            "RECAPTCHA__GLOBALSECRETKEY",
            "RECAPTCHA__V3SITEKEY",
            "RECAPTCHA__V3SECRETKEY",
            "OPENWEATHER__APIKEY",
            "PAXFFSERVICE__CLIENTSECRET",
            "PAXKCSERVICE__CLIENTSECRET",
            "PAXSERVICE__PASSWORD",
            "PAXFFSERVICE__TESTCLIENTSECRET",
            "PAXSERVICE__TOKEN",
            "PAXFFSERVICE__REFRESHTOKEN",
            "PAXKCSERVICE__TESTCLIENTSECRET",
            "PAXKCSERVICE__PRODCLIENTSECRET",
            "PAXKCSERVICE__PRODPASSWORD"
          ]'

          APP_SECRETS=$(jq -c \
            --argjson required "$REQUIRED_KEYS" '
              with_entries(
                select(
                  .key as $key
                  | $required
                  | index($key)
                )
              )
            ' <<< "$ALL_SECRETS_JSON")

          MISSING_KEYS=$(jq -cn \
            --argjson required "$REQUIRED_KEYS" \
            --argjson actual "$APP_SECRETS" '
              $required - ($actual | keys)
            ')

          MISSING_COUNT=$(jq 'length' <<< "$MISSING_KEYS")

          if [[ "$MISSING_COUNT" -ne 0 ]]; then
            echo "::error::Internal API için gerekli GitHub Secrets değerlerinden bazıları eksik."
            echo "Eksik keyler:"
            jq -r '.[]' <<< "$MISSING_KEYS"
            exit 1
          fi

          SECRET_COUNT=$(jq 'length' <<< "$APP_SECRETS")

          jq -n \
            --arg name "$SECRET_NAME" \
            --arg ns "$TARGET_NS" \
            --argjson secrets "$APP_SECRETS" \
            '{
              apiVersion: "v1",
              kind: "Secret",
              metadata: {
                name: $name,
                namespace: $ns
              },
              type: "Opaque",
              stringData: $secrets
            }' \
            | kubectl apply -f -

          echo "**internalapi-secrets** oluşturuldu/güncellendi: $SECRET_COUNT key." \
            >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------
      # Verify
      # -------------------------------------------------------
      - name: "Verify Kubernetes Secrets"
        run: |
          set -euo pipefail

          kubectl get secret webapp-secrets \
            externalapi-secrets \
            internalapi-secrets \
            -n "$TARGET_NS"