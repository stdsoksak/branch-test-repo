name: Main Release and Production
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: read
  packages: write
jobs:
  main-gate:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release or hotfix candidate
        env:
          HEAD: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          source scripts/lib.sh
          IMAGE=$(image_name)
          if [[ "$HEAD" =~ ^release-ct-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            RELEASE=$(resolve_digest "$IMAGE:release-v${VERSION}")
            WEBCT=$(resolve_digest "$IMAGE:env-webct")
            [[ "$RELEASE" == "$WEBCT" ]]
          elif [[ "$HEAD" =~ ^hotfix-v([0-9]+\.[0-9]+\.[0-9]+)-.+$ ]]; then
            ./scripts/test.sh
            resolve_digest "$IMAGE:git-${HEAD_SHA}" >/dev/null
          else
            echo "Unsupported source: $HEAD"; exit 1
          fi

  deploy-production:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'release-ct-v') || startsWith(github.event.pull_request.head.ref, 'hotfix-v'))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote approved artifact, do not rebuild
        env:
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          source scripts/lib.sh
          IMAGE=$(image_name)
          if [[ "$HEAD" =~ ^release-ct-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"; SOURCE="release-v${VERSION}"
          elif [[ "$HEAD" =~ ^hotfix-v([0-9]+\.[0-9]+\.[0-9]+)-.+$ ]]; then
            VERSION="${BASH_REMATCH[1]}"; SOURCE="git-${HEAD_SHA}"
          else
            exit 1
          fi

          SOURCE_DIGEST=$(resolve_digest "$IMAGE:$SOURCE")
          FINAL="v${VERSION}"
          if docker buildx imagetools inspect "$IMAGE:$FINAL" >/dev/null 2>&1; then
            [[ "$(resolve_digest "$IMAGE:$FINAL")" == "$SOURCE_DIGEST" ]] || { echo 'Final version tag already points elsewhere'; exit 1; }
          else
            promote_image "$IMAGE" "$SOURCE" "$FINAL" >/dev/null
          fi
          PROD=$(promote_image "$IMAGE" "$FINAL" env-production)
          echo "### Production" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: \`$FINAL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest: \`$PROD\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- rebuild: **no**" >> "$GITHUB_STEP_SUMMARY"
