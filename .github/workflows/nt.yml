name: NT Promotion
on:
  pull_request:
    branches: [validation-nt]
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: read
  packages: write
jobs:
  promotion-gate:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify ND artifact
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          [[ "$HEAD" == develop-nd ]]
          source scripts/lib.sh
          IMAGE=$(image_name)
          SOURCE=$(resolve_digest "$IMAGE:git-${SOURCE_SHA}")
          WEBND=$(resolve_digest "$IMAGE:env-webnd")
          echo "source=$SOURCE"
          echo "webnd=$WEBND"
          [[ "$SOURCE" == "$WEBND" ]]

  promote-webnt:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop-nd'
    runs-on: ubuntu-latest
    environment: webnt
    concurrency:
      group: webnt
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote without rebuild
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          source scripts/lib.sh
          IMAGE=$(image_name)
          SOURCE=$(resolve_digest "$IMAGE:git-${SOURCE_SHA}")
          WEBNT=$(promote_image "$IMAGE" "git-${SOURCE_SHA}" env-webnt)
          [[ "$SOURCE" == "$WEBNT" ]]
          echo "### WEBNT" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR head SHA: \`$SOURCE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest: \`$WEBNT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- rebuild: **no**" >> "$GITHUB_STEP_SUMMARY"
