name: Promote Nexum Environment

on:
  workflow_call:
    inputs:
      source_environment:
        required: true
        type: string
      target_environment:
        required: true
        type: string
      source_branch:
        required: true
        type: string
      version:
        required: false
        default: ""
        type: string
      target_image_tag:
        required: false
        default: ""
        type: string
      release_id:
        required: false
        default: ""
        type: string
      release_status:
        required: false
        default: build
        type: string
      create_catalog:
        required: false
        default: false
        type: boolean
      catalog_id:
        required: false
        default: ""
        type: string
      update_catalog:
        required: false
        default: false
        type: boolean
      expected_source_release_id:
        required: false
        default: ""
        type: string
      expected_source_revision:
        required: false
        default: ""
        type: string
      expected_source_status:
        required: false
        default: ""
        type: string

    outputs:
      source_revision:
        value: ${{ jobs.validate.outputs.source_revision }}
      source_image_tag:
        value: ${{ jobs.validate.outputs.source_image_tag }}
      release_id:
        value: ${{ jobs.validate.outputs.release_id }}

env:
  HARBOR_REGISTRY: registry.kube-system.svc.cluster.local:80
  HARBOR_PROJECT: nexum
  GITOPS_OWNER: stdsoksak
  GITOPS_REPOSITORY: test-gitops
  GITOPS_BRANCH: main
  GITOPS_PROJECT_PATH: nexum/argocd/environments
  GITOPS_RELEASE_PATH: nexum/releases

jobs:
  validate:
    name: Validate ${{ inputs.source_environment }} artifacts
    runs-on: nexum-project-local
    environment: ${{ inputs.target_environment }}

    outputs:
      source_revision: ${{ steps.metadata.outputs.source_revision }}
      source_image_tag: ${{ steps.metadata.outputs.source_image_tag }}
      release_id: ${{ steps.metadata.outputs.release_id }}
      version: ${{ steps.metadata.outputs.version }}
      target_tag: ${{ steps.metadata.outputs.target_tag }}
      source_branch: ${{ steps.metadata.outputs.source_branch }}
      webapp_digest: ${{ steps.webapp_digest.outputs.result }}
      internalapi_digest: ${{ steps.internalapi_digest.outputs.result }}
      externalapi_digest: ${{ steps.externalapi_digest.outputs.result }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          driver-opts: |
            network=host
          buildkitd-config-inline: |
            [registry."${{ env.HARBOR_REGISTRY }}"]
              http = true
              insecure = true

      - name: Checkout GitOps repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_OWNER }}/${{ env.GITOPS_REPOSITORY }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          fetch-depth: 0
          persist-credentials: false

      # yq is provided by a GitHub Action. ARC does not need yq installed.
      - name: Read webapp tag
        id: webapp_tag
        uses: mikefarah/yq@v4.53.6
        with:
          cmd: yq -r '.deployment.image.tag // ""' 'gitops/${{ env.GITOPS_PROJECT_PATH }}/${{ inputs.source_environment }}/webapp/values.yaml'

      - name: Read webapp release ID
        id: webapp_release
        uses: mikefarah/yq@v4.53.6
        with:
          cmd: yq -r '.deployment.labels."nexum.pegasusum.com/release-id" // ""' 'gitops/${{ env.GITOPS_PROJECT_PATH }}/${{ inputs.source_environment }}/webapp/values.yaml'

      - name: Read webapp source revision
        id: webapp_revision
        uses: mikefarah/yq@v4.53.6
        with:
          cmd: yq -r '.deployment.labels."nexum.pegasusum.com/source-revision" // ""' 'gitops/${{ env.GITOPS_PROJECT_PATH }}/${{ inputs.source_environment }}/webapp/values.yaml'

      - name: Read webapp digest
        id: webapp_digest
        uses: mikefarah/yq@v4.53.6
        with:
          cmd: yq -r '.deployment.image.digest // ""' 'gitops/${{ env.GITOPS_PROJECT_PATH }}/${{ inputs.source_environment }}/webapp/values.yaml'

      - name: Read internalapi tag
        id: internalapi_tag
        uses: mikefarah/yq@v4.53.6
        with:
          cmd: yq -r '.deployment.image.tag // ""' 'gitops/${{ env.GITOPS_PROJECT_PATH }}/${{ inputs.source_environment }}/internalapi/values.yaml'

      - name: Read internalapi release ID
        id: internalapi_release
        uses: mikefarah/yq@v4.53.6
        with:
          cmd: yq -r '.deployment.labels."nexum.pegasusum.com/release-id" // ""' 'gitops/${{ env.GITOPS_PROJECT_PATH }}/${{ inputs.source_environment }}/internalapi/values.yaml'

      - name: Read internalapi source revision
        id: internalapi_revision
        uses: mikefarah/yq@v4.53.6
        with:
          cmd: yq -r '.deployment.labels."nexum.pegasusum.com/source-revision" // ""' 'gitops/${{ env.GITOPS_PROJECT_PATH }}/${{ inputs.source_environment }}/internalapi/values.yaml'

      - name: Read internalapi digest
        id: internalapi_digest
        uses: mikefarah/yq@v4.53.6
        with:
          cmd: yq -r '.deployment.image.digest // ""' 'gitops/${{ env.GITOPS_PROJECT_PATH }}/${{ inputs.source_environment }}/internalapi/values.yaml'

      - name: Read externalapi tag
        id: externalapi_tag
        uses: mikefarah/yq@v4.53.6
        with:
          cmd: yq -r '.deployment.image.tag // ""' 'gitops/${{ env.GITOPS_PROJECT_PATH }}/${{ inputs.source_environment }}/externalapi/values.yaml'

      - name: Read externalapi release ID
        id: externalapi_release
        uses: mikefarah/yq@v4.53.6
        with:
          cmd: yq -r '.deployment.labels."nexum.pegasusum.com/release-id" // ""' 'gitops/${{ env.GITOPS_PROJECT_PATH }}/${{ inputs.source_environment }}/externalapi/values.yaml'

      - name: Read externalapi source revision
        id: externalapi_revision
        uses: mikefarah/yq@v4.53.6
        with:
          cmd: yq -r '.deployment.labels."nexum.pegasusum.com/source-revision" // ""' 'gitops/${{ env.GITOPS_PROJECT_PATH }}/${{ inputs.source_environment }}/externalapi/values.yaml'

      - name: Read externalapi digest
        id: externalapi_digest
        uses: mikefarah/yq@v4.53.6
        with:
          cmd: yq -r '.deployment.image.digest // ""' 'gitops/${{ env.GITOPS_PROJECT_PATH }}/${{ inputs.source_environment }}/externalapi/values.yaml'

      - name: Validate source catalog and prepare target metadata
        id: metadata
        uses: mikefarah/yq@v4.53.6
        env:
          WEBAPP_RELEASE_ID: ${{ steps.webapp_release.outputs.result }}
          INTERNALAPI_RELEASE_ID: ${{ steps.internalapi_release.outputs.result }}
          EXTERNALAPI_RELEASE_ID: ${{ steps.externalapi_release.outputs.result }}
          WEBAPP_SOURCE_REVISION: ${{ steps.webapp_revision.outputs.result }}
          INTERNALAPI_SOURCE_REVISION: ${{ steps.internalapi_revision.outputs.result }}
          EXTERNALAPI_SOURCE_REVISION: ${{ steps.externalapi_revision.outputs.result }}
          WEBAPP_TAG: ${{ steps.webapp_tag.outputs.result }}
          INTERNALAPI_TAG: ${{ steps.internalapi_tag.outputs.result }}
          EXTERNALAPI_TAG: ${{ steps.externalapi_tag.outputs.result }}
          WEBAPP_DIGEST: ${{ steps.webapp_digest.outputs.result }}
          INTERNALAPI_DIGEST: ${{ steps.internalapi_digest.outputs.result }}
          EXTERNALAPI_DIGEST: ${{ steps.externalapi_digest.outputs.result }}
          REQUESTED_RELEASE_ID: ${{ inputs.release_id }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_TARGET_TAG: ${{ inputs.target_image_tag }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          EXPECTED_SOURCE_RELEASE_ID: ${{ inputs.expected_source_release_id }}
          EXPECTED_SOURCE_REVISION: ${{ inputs.expected_source_revision }}
          EXPECTED_SOURCE_STATUS: ${{ inputs.expected_source_status }}
        with:
          cmd: |
            set -eu

            [ -n "$WEBAPP_RELEASE_ID" ]
            [ "$INTERNALAPI_RELEASE_ID" = "$WEBAPP_RELEASE_ID" ] || { echo "internalapi release ID differs"; exit 1; }
            [ "$EXTERNALAPI_RELEASE_ID" = "$WEBAPP_RELEASE_ID" ] || { echo "externalapi release ID differs"; exit 1; }
            [ "$INTERNALAPI_TAG" = "$WEBAPP_TAG" ] || { echo "internalapi tag differs"; exit 1; }
            [ "$EXTERNALAPI_TAG" = "$WEBAPP_TAG" ] || { echo "externalapi tag differs"; exit 1; }

            printf '%s\n' "$WEBAPP_RELEASE_ID" |
              grep -Eq '^(git-[0-9a-f]{7,40}|v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?)$'

            catalog_id="$WEBAPP_RELEASE_ID"
            case "$WEBAPP_RELEASE_ID" in
              v*-rc.*) catalog_id="${WEBAPP_RELEASE_ID%-rc.*}" ;;
            esac
            catalog="gitops/$GITOPS_RELEASE_PATH/$catalog_id.yaml"
            catalog_exists=false
            if [ -f "$catalog" ]; then
              catalog_exists=true
              case "$WEBAPP_RELEASE_ID" in
                v*-rc.*)
                  [ "$(RELEASE_ID="$WEBAPP_RELEASE_ID" yq -r '[.candidates[] | select(.id == strenv(RELEASE_ID))] | length' "$catalog")" -eq 1 ]
                  catalog_record="$(RELEASE_ID="$WEBAPP_RELEASE_ID" yq -o=json -I=0 '.candidates[] | select(.id == strenv(RELEASE_ID))' "$catalog")"
                  source_status=candidate
                  ;;
                v*)
                  [ "$(yq -r '.final.id // ""' "$catalog")" = "$WEBAPP_RELEASE_ID" ]
                  catalog_record="$(yq -o=json -I=0 '.final' "$catalog")"
                  source_status=final
                  ;;
              esac
              source_revision="$(printf '%s\n' "$catalog_record" | yq -r '.source.revision // ""')"
              catalog_tag="$(printf '%s\n' "$catalog_record" | yq -r '.services.webapp.tag // ""')"
              [ "$catalog_tag" = "$WEBAPP_TAG" ] || { echo "Source tag differs from catalog"; exit 1; }
            else
              case "$WEBAPP_RELEASE_ID" in
                git-*) ;;
                *) echo "Missing source release catalog: $WEBAPP_RELEASE_ID"; exit 1 ;;
              esac

              source_revision="$WEBAPP_SOURCE_REVISION"
              source_status=build
              [ "$INTERNALAPI_SOURCE_REVISION" = "$source_revision" ] || { echo "internalapi source revision differs"; exit 1; }
              [ "$EXTERNALAPI_SOURCE_REVISION" = "$source_revision" ] || { echo "externalapi source revision differs"; exit 1; }
              printf '%s\n' "$source_revision" | grep -Eq '^[0-9a-f]{40,64}$'
            fi

            [ -z "$EXPECTED_SOURCE_RELEASE_ID" ] || [ "$WEBAPP_RELEASE_ID" = "$EXPECTED_SOURCE_RELEASE_ID" ] || {
              echo "Source release changed: expected $EXPECTED_SOURCE_RELEASE_ID, found $WEBAPP_RELEASE_ID"
              exit 1
            }
            [ -z "$EXPECTED_SOURCE_REVISION" ] || [ "$source_revision" = "$EXPECTED_SOURCE_REVISION" ] || {
              echo "Source revision changed: expected $EXPECTED_SOURCE_REVISION, found $source_revision"
              exit 1
            }
            [ -z "$EXPECTED_SOURCE_STATUS" ] || [ "$source_status" = "$EXPECTED_SOURCE_STATUS" ] || {
              echo "Source status changed: expected $EXPECTED_SOURCE_STATUS, found $source_status"
              exit 1
            }

            for app_name in webapp internalapi externalapi; do
              case "$app_name" in
                webapp) environment_digest="$WEBAPP_DIGEST" ;;
                internalapi) environment_digest="$INTERNALAPI_DIGEST" ;;
                externalapi) environment_digest="$EXTERNALAPI_DIGEST" ;;
              esac

              printf '%s\n' "$environment_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
              if [ "$catalog_exists" = "true" ]; then
                catalog_digest="$(printf '%s\n' "$catalog_record" | APP_NAME="$app_name" yq -r '.services[strenv(APP_NAME)].digest // ""')"
                catalog_service_tag="$(printf '%s\n' "$catalog_record" | APP_NAME="$app_name" yq -r '.services[strenv(APP_NAME)].tag // ""')"
                catalog_revision="$(printf '%s\n' "$catalog_record" | APP_NAME="$app_name" yq -r '.services[strenv(APP_NAME)].sourceCommit // ""')"

                [ "$catalog_digest" = "$environment_digest" ] || { echo "$app_name digest differs from catalog"; exit 1; }
                [ "$catalog_service_tag" = "$WEBAPP_TAG" ] || { echo "$app_name tag differs from catalog"; exit 1; }
                [ "$catalog_revision" = "$source_revision" ] || { echo "$app_name source revision differs"; exit 1; }
              fi
            done

            release_id="$REQUESTED_RELEASE_ID"
            version="$REQUESTED_VERSION"
            target_tag="$REQUESTED_TARGET_TAG"

            [ -n "$release_id" ] || release_id="$WEBAPP_RELEASE_ID"
            [ -n "$version" ] || version="$release_id"
            [ -n "$target_tag" ] || target_tag="$WEBAPP_TAG"
            printf '%s\n' "$target_tag" |
              grep -Eq '^(git-[0-9a-f]{7,40}|v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?)$'

            echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"
            echo "source_image_tag=$WEBAPP_TAG" >> "$GITHUB_OUTPUT"
            echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "target_tag=$target_tag" >> "$GITHUB_OUTPUT"
            echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"

      # Harbor validates that GitOps still references the expected immutable artifacts.
      - name: Verify artifacts in Harbor
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.metadata.outputs.source_image_tag }}
          WEBAPP_DIGEST: ${{ steps.webapp_digest.outputs.result }}
          INTERNALAPI_DIGEST: ${{ steps.internalapi_digest.outputs.result }}
          EXTERNALAPI_DIGEST: ${{ steps.externalapi_digest.outputs.result }}
        run: |
          set -euo pipefail

          verify_image() {
            local app="$1"
            local expected_digest="$2"
            local repository="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${app}"
            local image="${repository}:${SOURCE_TAG}"

            actual_digest="$(
              docker buildx imagetools inspect "$image" |
                awk '/^Digest:/ {print $2; exit}'
            )"

            [[ "$actual_digest" == "$expected_digest" ]] || {
              echo "Digest mismatch for $app"
              echo "GitOps : $expected_digest"
              echo "Harbor : $actual_digest"
              exit 1
            }
          }

          verify_image webapp "$WEBAPP_DIGEST"
          verify_image internalapi "$INTERNALAPI_DIGEST"
          verify_image externalapi "$EXTERNALAPI_DIGEST"

      # Aliases are immutable: an existing RC/final tag must resolve to the same digest.
      - name: Create candidate alias when required
        if: inputs.target_image_tag != ''
        shell: bash
        env:
          TARGET_TAG: ${{ steps.metadata.outputs.target_tag }}
          WEBAPP_DIGEST: ${{ steps.webapp_digest.outputs.result }}
          INTERNALAPI_DIGEST: ${{ steps.internalapi_digest.outputs.result }}
          EXTERNALAPI_DIGEST: ${{ steps.externalapi_digest.outputs.result }}
        run: |
          set -euo pipefail

          alias_image() {
            local app="$1"
            local expected_digest="$2"
            local repository="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${app}"
            local existing_digest

            existing_digest="$(
              docker buildx imagetools inspect "${repository}:${TARGET_TAG}" 2>/dev/null |
                awk '/^Digest:/ {print $2; exit}' || true
            )"

            if [[ -n "$existing_digest" ]]; then
              [[ "$existing_digest" == "$expected_digest" ]] || {
                echo "Immutable tag conflict: ${repository}:${TARGET_TAG}"
                exit 1
              }
              return
            fi

            docker buildx imagetools create \
              --tag "${repository}:${TARGET_TAG}" \
              "${repository}@${expected_digest}"
          }

          alias_image webapp "$WEBAPP_DIGEST"
          alias_image internalapi "$INTERNALAPI_DIGEST"
          alias_image externalapi "$EXTERNALAPI_DIGEST"

  deploy:
    name: Promote artifact set to ${{ inputs.target_environment }}
    needs: validate
    uses: ./.github/workflows/_update-gitops-values.yml
    with:
      target_environment: ${{ inputs.target_environment }}
      release_id: ${{ needs.validate.outputs.release_id }}
      release_status: ${{ inputs.release_status }}
      create_catalog: ${{ inputs.create_catalog }}
      catalog_id: ${{ inputs.catalog_id }}
      update_catalog: ${{ inputs.update_catalog }}
      artifact_set: >-
        [
          {"app_name":"webapp","digest":"${{ needs.validate.outputs.webapp_digest }}"},
          {"app_name":"internalapi","digest":"${{ needs.validate.outputs.internalapi_digest }}"},
          {"app_name":"externalapi","digest":"${{ needs.validate.outputs.externalapi_digest }}"}
        ]
      image_tag: ${{ needs.validate.outputs.target_tag }}
      version: ${{ needs.validate.outputs.version }}
      source_branch: ${{ needs.validate.outputs.source_branch }}
      source_revision: ${{ needs.validate.outputs.source_revision }}
      promoted_from: ${{ inputs.source_environment }}
      commit_message: "chore(nexum): promote ${{ needs.validate.outputs.source_image_tag }} to ${{ inputs.target_environment }}"
    secrets: inherit
