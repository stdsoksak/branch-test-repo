name: Manual Release Branch Created
on:
  create:
permissions:
  contents: read
  packages: write
jobs:
  manual-release:
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release-ct-v')
    runs-on: ubuntu-latest
    environment: webct
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate cut and promote
        env:
          BRANCH: ${{ github.event.ref }}
          CREATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="${BRANCH#release-ct-v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin validation-nt
          [[ "$CREATED_SHA" == "$(git rev-parse origin/validation-nt)" ]] || { echo 'Release branch must be cut from current validation-nt'; exit 1; }
          source scripts/lib.sh
          IMAGE=$(image_name)
          promote_image "$IMAGE" env-webnt "release-v${VERSION}" >/dev/null
          promote_image "$IMAGE" "release-v${VERSION}" env-webct >/dev/null
