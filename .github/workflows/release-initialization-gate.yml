name: Release Initialization Gate
run-name: Release gate | PR #${{ github.event.pull_request.number }} to ${{ github.event.pull_request.base.ref }}

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
    branches:
      - "release/**"

permissions:
  contents: read

concurrency:
  group: release-initialization-${{ github.event.pull_request.base.ref }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  GITOPS_OWNER: stdsoksak
  GITOPS_REPOSITORY: test-gitops
  GITOPS_BRANCH: main
  GITOPS_RELEASE_PATH: nexum/releases

jobs:
  release-initialized:
    name: Release Initialization Gate
    runs-on: nexum-project-local

    steps:
      - name: Resolve release version
        id: release
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          [[ "$RELEASE_BRANCH" =~ ^release/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
            echo "::error title=Geçersiz Release Dalı::Hedef dal 'release/vX.Y.Z' formatında olmalıdır. (Mevcut: $RELEASE_BRANCH)"
            exit 1
          }
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout GitOps main
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_OWNER }}/${{ env.GITOPS_REPOSITORY }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          fetch-depth: 1
          persist-credentials: false

      - name: Require initialized release catalog
        uses: mikefarah/yq@v4.53.6
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        with:
          cmd: |
            set -eu

            catalog="gitops/$GITOPS_RELEASE_PATH/$VERSION.yaml"

            if [ ! -f "$catalog" ]; then
              echo "::error title=Release Gate: Katalog Bulunamadi::${VERSION} surum katalogu GitOps uzerinde henuz baslatilmamis ($catalog). Lutfen once Actions ekranindan 'CD - Release' (workflow_dispatch) calistirin."
              {
                echo "# Release Initialization Gate: KILITLI"
                echo ""
                echo "> [!CAUTION]"
                echo "> **${VERSION}** surum katalogu GitOps deposunda (\`main\`) bulunamadi."
                echo "> Release branch'ine erken PR merge edilerek surumun kilitlenmesini onlemek icin merge butonu kilitlendi."
                echo ""
                echo "### Durum Bilgisi"
                echo "| Alan | Deger |"
                echo "| :--- | :--- |"
                echo "| **Surum (Version)** | \`${VERSION}\` |"
                echo "| **Hedef Dal** | \`${RELEASE_BRANCH}\` |"
                echo "| **Beklenen Katalog** | \`${catalog}\` (Bulunamadi) |"
                echo "| **Gate Sonucu** | Merge Engellendi |"
                echo ""
                echo "### Kilidi Acmak Icin Yapilmasi Gerekenler"
                echo "1. GitHub Actions sekmesinden **CD - Release** workflow'una gidin."
                echo "2. **Run workflow** butonuna basip \`version: ${VERSION#v}\` parametresiyle calistirin."
                echo "3. GitOps reposunda acilan **rc.1 Pull Request'ini inceleyip merge edin**."
                echo "4. Bu PR sayfasina geri donun; Release Gate kontrolu otomatik olarak basarili olacaktir."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "::group::GitOps Katalog Dogrulama Loglari"

            if [ "$(yq -r '.version // ""' "$catalog")" != "$VERSION" ]; then
              echo "::error title=Katalog Versiyon Uyusmazligi::Katalogdaki versiyon ($catalog) ile ${VERSION} uyusmuyor."
              exit 1
            fi

            if [ "$(yq -r '.status // ""' "$catalog")" != "candidate" ]; then
              echo "::error title=Gecersiz Surum Statusu::${VERSION} katalogu aktif bir candidate surum degil."
              exit 1
            fi

            active_candidate="$(yq -r '.activeCandidate // ""' "$catalog")"
            escaped_version="$(printf '%s' "$VERSION" | sed 's/\./\\./g')"
            if ! printf '%s\n' "$active_candidate" | grep -Eq "^${escaped_version}-rc\.[1-9][0-9]*$"; then
              echo "::error title=Gecersiz Aktif Aday::${VERSION} katalogunda gecerli bir aktif aday bulunamadi."
              exit 1
            fi

            candidate_count="$(RELEASE_ID="$active_candidate" yq -r '[.candidates[] | select(.id == strenv(RELEASE_ID))] | length' "$catalog")"
            if [ "$candidate_count" -ne 1 ]; then
              echo "::error title=Aday Kayit Hatasi::Aktif aday ($active_candidate) katalogda eksik veya birden fazla."
              exit 1
            fi

            echo "Katalog basariyla dogrulandi: $catalog"
            echo "Aktif aday: $active_candidate"
            echo "::endgroup::"

            echo "::notice title=Release Gate: Onaylandi::${VERSION} katalogu dogrulandi (Aktif Aday: ${active_candidate}). PR merge edilebilir."

            {
              echo "# Release Initialization Gate: ONAYLANDI"
              echo ""
              echo "> [!NOTE]"
              echo "> \`${VERSION}\` surum katalogu ve aktif aday (\`${active_candidate}\`) GitOps uzerinde dogrulandi."
              echo "> Bu PR guvenle merge edilebilir."
              echo ""
              echo "### Dogrulama Ozeti"
              echo "| Parametre | Deger |"
              echo "| :--- | :--- |"
              echo "| **Surum (Version)** | \`${VERSION}\` |"
              echo "| **Hedef Dal** | \`${RELEASE_BRANCH}\` |"
              echo "| **Aktif Aday (Candidate)** | \`${active_candidate}\` |"
              echo "| **Katalog Dosyasi** | \`${catalog}\` |"
              echo "| **Katalog Statusu** | \`candidate\` |"
              echo "| **Gate Sonucu** | Merge Edilebilir |"
            } >> "$GITHUB_STEP_SUMMARY"
