name: Release Initialization Gate
run-name: Release gate | PR #${{ github.event.pull_request.number }} to ${{ github.event.pull_request.base.ref }}

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
    branches:
      - "release/**"

permissions:
  contents: read

concurrency:
  group: release-initialization-${{ github.event.pull_request.base.ref }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  GITOPS_OWNER: stdsoksak
  GITOPS_REPOSITORY: test-gitops
  GITOPS_BRANCH: main
  GITOPS_RELEASE_PATH: nexum/releases

jobs:
  release-initialized:
    name: Release Initialization Gate
    runs-on: nexum-project-local

    steps:
      - name: Resolve release version
        id: release
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          [[ "$RELEASE_BRANCH" =~ ^release/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
            echo "Release branch must look like release/v1.2.0."
            exit 1
          }
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Checkout GitOps main
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_OWNER }}/${{ env.GITOPS_REPOSITORY }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          fetch-depth: 1
          persist-credentials: false

      - name: Require initialized release catalog
        id: catalog
        uses: mikefarah/yq@v4.53.6
        env:
          VERSION: ${{ steps.release.outputs.version }}
        with:
          cmd: |
            set -eu

            catalog="gitops/$GITOPS_RELEASE_PATH/$VERSION.yaml"
            [ -f "$catalog" ] || {
              echo "$VERSION is not initialized on GitOps main."
              echo "Run CD - Release and merge its initial WEBCT GitOps pull request before merging source changes."
              exit 1
            }

            [ "$(yq -r '.version // ""' "$catalog")" = "$VERSION" ] || {
              echo "Catalog version does not match $VERSION."
              exit 1
            }
            [ "$(yq -r '.status // ""' "$catalog")" = "candidate" ] || {
              echo "$VERSION is not an active candidate release."
              exit 1
            }

            active_candidate="$(yq -r '.activeCandidate // ""' "$catalog")"
            escaped_version="$(printf '%s' "$VERSION" | sed 's/\./\\./g')"
            printf '%s\n' "$active_candidate" | grep -Eq "^${escaped_version}-rc\.[1-9][0-9]*$" || {
              echo "$VERSION catalog has no valid active candidate."
              exit 1
            }

            [ "$(RELEASE_ID="$active_candidate" yq -r '[.candidates[] | select(.id == strenv(RELEASE_ID))] | length' "$catalog")" -eq 1 ] || {
              echo "Active candidate $active_candidate is missing or duplicated in the catalog."
              exit 1
            }

            echo "active_candidate=$active_candidate" >> "$GITHUB_OUTPUT"
            echo "$VERSION is initialized with active candidate $active_candidate."

      - name: Write gate summary
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          ACTIVE_CANDIDATE: ${{ steps.catalog.outputs.active_candidate }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Release Initialization Gate"
            echo "- Result: \`$RESULT\`"
            echo "- Pull request: \`#$PR_NUMBER\`"
            echo "- Release branch: \`$RELEASE_BRANCH\`"
            echo "- Version: \`${VERSION:-unresolved}\`"
            echo "- GitOps catalog: \`${VERSION:+$GITOPS_RELEASE_PATH/$VERSION.yaml}\`"
            if [[ -n "$ACTIVE_CANDIDATE" ]]; then
              echo "- Active candidate: \`$ACTIVE_CANDIDATE\`"
            else
              echo "- Action required: initialize the release through \`CD - Release\` and merge its WEBCT GitOps pull request."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
