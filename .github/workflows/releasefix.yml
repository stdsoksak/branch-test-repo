name: Release Fix
on:
  pull_request:
    branches: ['release-ct-v*']
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: read
  packages: write
jobs:
  releasefix-ci:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          [[ "${{ github.head_ref }}" =~ ^releasefix- ]]
          ./scripts/test.sh
          echo 'Run approved static/security tooling here.'

  build-and-redeploy-webct:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'releasefix-')
    runs-on: ubuntu-latest
    environment: webct
    concurrency:
      group: webct
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: New code means new image
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          source scripts/lib.sh
          IMAGE=$(image_name)
          VERSION="${BASE#release-ct-v}"
          ensure_image "$IMAGE" "$MERGE_SHA" >/dev/null
          promote_image "$IMAGE" "git-${MERGE_SHA}" "release-v${VERSION}" >/dev/null
          DIGEST=$(promote_image "$IMAGE" "release-v${VERSION}" env-webct)
          echo "### WEBCT release fix" >> "$GITHUB_STEP_SUMMARY"
          echo "- new digest: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- rebuild: **yes**" >> "$GITHUB_STEP_SUMMARY"
